<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Native form</title></head>
<body>
<main>
  <form id="booking" action="/api/bookings" method="post">
    <h1>Book a sitter</h1>

    <label for="petName">Pet name</label>
    <input id="petName" name="petName" type="text" required maxlength="50">
    <button type="button" id="clear" aria-label="Clear pet name">x</button>

    <fieldset>
      <legend>Pet type</legend>
      <input type="radio" id="pt-dog" name="petType" value="dog" required><label for="pt-dog">Dog</label>
      <input type="radio" id="pt-cat" name="petType" value="cat"><label for="pt-cat">Cat</label>
      <input type="radio" id="pt-other" name="petType" value="other"><label for="pt-other">Other</label>
    </fieldset>

    <label for="startDate">Start date</label>
    <input id="startDate" name="startDate" type="date" required min="2026-01-01" max="2027-12-31">

    <label for="email">Owner email</label>
    <input id="email" name="email" type="email" required>

    <input id="phone" name="phone" type="tel" placeholder="Phone number">

    <label for="size">Pet size</label>
    <select id="size" name="size">
      <option value="s">Small</option>
      <option value="m">Medium</option>
      <option value="l">Large</option>
    </select>

    <label for="notes">Special instructions</label>
    <textarea id="notes" name="notes" minlength="2"></textarea>

    <button type="button" id="draft">Save draft</button>
    <button type="submit" id="book">Book</button>
  </form>
</main>
</body>
</html>
