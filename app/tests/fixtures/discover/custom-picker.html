<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Custom picker</title>
<style>
  .opt { cursor: pointer; display: inline-block; padding: 4px 8px; border: 1px solid #999; }
  .opt.selected { background: #cde; }
</style>
</head>
<body>
<form id="booking">
  <h1>Book a sitter</h1>
  <label for="petName">Pet name</label>
  <input id="petName" name="petName" type="text" required>

  <div class="picker">
    <div class="picker-label">Pet type</div>
    <div class="opt" data-value="dog">Dog</div>
    <div class="opt" data-value="cat">Cat</div>
    <div class="opt" data-value="other">Other</div>
  </div>

  <button type="submit">Book</button>
</form>
<script>
  for (const el of document.querySelectorAll('.opt')) {
    el.addEventListener('click', () => {
      for (const o of document.querySelectorAll('.opt')) o.classList.remove('selected');
      el.classList.add('selected');
      document.querySelector('.picker').dataset.value = el.dataset.value;
    });
  }
</script>
</body>
</html>
