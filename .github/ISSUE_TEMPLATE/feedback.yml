name: Feedback
description: Tell us how Run Hound 0.5.0 did on your app (a wrong finding, a bug it missed, a crash, or something confusing).
title: "[Feedback] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying Run Hound. The most useful feedback names the finding (or the bug it missed) and attaches the report.
        **Before attaching anything, look through it:** screenshots show whatever your page showed, and Run Hound can only redact text, not pixels. Attach one run folder (`runs/<runId>`), never the whole `runs/` folder: `runs/.config` holds saved API keys and test-account passwords.
        See [TESTING.md](https://github.com/rahul-bharati/run-hound/blob/main/TESTING.md#sending-feedback) for what to include.
  - type: dropdown
    id: kind
    attributes:
      label: What kind of feedback is this?
      options:
        - "False positive: a finding that is wrong"
        - "Missed bug: a real problem Run Hound didn't report"
        - "Crash or error: the run stopped, errored or never finished"
        - "Confusing: a message, report or step I didn't understand"
        - "It worked: a clean or useful run (tell us about it!)"
        - Something else
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part of Run Hound?
      options:
        - "Form checks (a form on the page)"
        - "Page-wide checks (buttons outside forms, headers, cookies, CORS, source maps)"
        - "Signed-in runs and access checks (0.4.0, V2 preview: access-control, mass-assignment, deep-links)"
        - "Write-side checks (0.5.0, V2 preview: write-access, csrf, paywall-trust)"
        - "AI features (plan review, suggested flows, explanations)"
        - Install, Docker or the test lab
        - The report or the web UI
        - Something else
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Run Hound version
      description: "`docker run --rm ghcr.io/rahul-bharati/run-hound:0.5.0 --version`, `pnpm exec tsx src/cli.ts --version` in `app/` from source, or `runHoundVersion` in report.json."
      placeholder: run-hound 0.5.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and Node version
      placeholder: "macOS 16.1, Node 24.21 / Ubuntu 24.04, Docker 29 / Windows 11 + WSL2"
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How did you run it?
      options:
        - Web UI, local install (pnpm serve)
        - Command line, local install (pnpm exec tsx src/cli.ts run)
        - Docker or Podman test lab, web UI (docker compose up)
        - Docker or Podman, single container (docker run)
        - Docker or Podman, command line (docker compose run / docker run ... run)
    validations:
      required: true
  - type: dropdown
    id: signed-in
    attributes:
      label: Was the run signed in as a test account?
      options:
        - "No"
        - "Yes, as account A (with account B set up)"
        - "Yes, as account A (no account B)"
        - "Yes, as account B"
    validations:
      required: false
  - type: input
    id: ai
    attributes:
      label: AI on? Provider and model
      description: Leave empty if AI was off (the default).
      placeholder: "Ollama, qwen3:8b"
    validations:
      required: false
  - type: input
    id: target
    attributes:
      label: What did you test?
      description: The kind of app and page, the framework and the dev server. Not the URL if it's private.
      placeholder: "Next.js 16 dev server, sign-up form that posts to a server action"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: For a wrong finding, quote its title and say why it's wrong. For a missed bug, describe the bug and how you'd reproduce it by hand.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
  - type: textarea
    id: report
    attributes:
      label: Report
      description: |
        Drag in `report.md` from the run folder (runs/<runId>/), or a zip of that one run folder. Paste the exit code and any error text from the terminal too.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before sending
      options:
        - label: I checked the attachments contain nothing I don't want to share (screenshots are not redacted), and I attached no password or API key.
          required: true
