# Builds the desktop installers on a native runner for each target and, for a release tag, publishes them -- but only
# when they are signed (docs/desktop-architecture.md Rule 7: an unsigned installer is not a supported release).
#
#   macOS arm64    dmg   macos-15          Windows x64   NSIS   windows-2025
#   macOS x64      dmg   macos-15-intel    Linux x64     deb, rpm   ubuntu-24.04
#                                          Linux arm64   deb, rpm   ubuntu-24.04-arm
# Each target is built on its own platform and architecture because the Chromium the app bundles
# (desktop/scripts/fetch-browsers.mjs) is the host's. Runner labels are from GitHub's documentation
# (docs.github.com/en/actions/reference/runners/github-hosted-runners, 8 October 2026): standard runners are free for
# public repositories, including the arm64 and Intel ones; the macOS pair is pinned to macos-15 so both sides of the
# dmg pair are the same macOS (macos-latest is macos-26).
#
# Build now, sign later: every build produces installers as private workflow artifacts (7 days), named
# Run-Hound-<version>-<os>-<arch>[-unsigned].<ext>. Only a run for a release tag (v*.*.*) signs; pushes, pull requests
# and manual runs build unsigned whatever secrets exist (their signing steps are not given the secrets, and
# desktop/scripts/signing.mjs refuses to sign outside a release tag as a second lock). On a tag the macOS and Windows build
# legs run in the GitHub Environment `release-signing`, where the secrets live (docs/development.md "Signing secrets"), and
# signing and notarization switch on by themselves when the secrets exist; desktop/scripts/signing.mjs decides, from
# electron-builder's own variables:
#   macOS    MACOS_CSC_LINK (base64 .p12 of a Developer ID Application certificate) and MACOS_CSC_KEY_PASSWORD, and
#            notarization by either APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID, or
#            APPLE_API_KEY_P8 (the .p8 file's text) + APPLE_API_KEY_ID + APPLE_API_ISSUER
#   Windows  WIN_CSC_LINK (base64 .pfx) and WIN_CSC_KEY_PASSWORD
# A platform with an incomplete set builds unsigned and says why in the log and the job summary. Linux packages are not
# signed by this pipeline. A signed build is then verified, not trusted: codesign, spctl and stapler on macOS,
# Get-AuthenticodeSignature on Windows, and the build fails if any of them disagrees.
#
# A release tag also has to pass `preflight` before anything is built: its commit must be on main, and CI must have passed
# on main for exactly that commit (the same check release-images.yml's ci-status makes). So no signing secret is ever
# handed to code that main has not tested.
#
# Publishing (tag v*.*.* only): the publish job runs when the gate job finds every macOS and Windows build signed and no
# blocking first-run leg (the install-and-run checks of the first-run jobs) failed, and
# then attaches the installers, a combined SHA256SUMS and the installer table to the GitHub Release of the tag. Otherwise the
# gate's summary says "not published: ..." and nothing leaves the workflow artifacts. The release is shared with
# release-images.yml (the images, the compose file and the CHANGELOG notes): whichever workflow gets there first creates it
# as a DRAFT, each adds its own part (assets and a block of the notes, scripts/release-coordination.mjs), and the one that
# completes the set publishes it. So a release page never goes public ahead of the images its compose file names or the
# installers the desktop app tells users to download, and a tag whose installers failed their gate stays a draft instead
# of becoming `releases/latest`, which the desktop app's update check announces.
name: Desktop installers

on:
  workflow_dispatch:
  push:
    branches: [main, integration/desktop]
    # Path filters are not evaluated for tag pushes (GitHub workflow syntax), so every release tag builds.
    paths: ["desktop/**", "app/src/**", ".github/workflows/desktop-installers.yml"]
    tags: ["v*.*.*"]
  # A pull request that changes the pipeline itself builds the whole matrix before it merges; the gate only ever passes on
  # a tag, so nothing is published from a pull request. workflow_dispatch can't help here: it needs the workflow on main.
  pull_request:
    paths: [".github/workflows/desktop-installers.yml", "desktop/scripts/**", "desktop/package.json"]

permissions:
  contents: read

concurrency:
  group: desktop-installers-${{ github.ref }}
  # A newer push replaces a branch build, but a release tag's build is never cancelled.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  # A release tag only (every other trigger skips this job and builds unsigned): is the tag's commit on main, and did CI pass
  # on main for exactly that commit? It is release-images.yml's ci-status check (a CI run on main for this exact commit that
  # is still running is waited for), and it runs BEFORE the build so that no signing secret reaches code main has not
  # tested: a tag can be pushed from any commit, and the release-signing Environment's tag rule only looks at the tag's name.
  # Unlike release-images.yml, this does not run CI itself when main's run is missing or failed: re-run CI on main, then
  # re-run this workflow. The job fails (red) when either check does, so a tag that signs nothing is not mistaken for a
  # green release.
  preflight:
    name: Tag is on main and CI passed
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      actions: read
      contents: read
    steps:
      - name: Is the tag's commit on main, and did CI pass for it there?
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          fail=()
          # compare/main...<sha> is "behind" when the commit is an ancestor of main and "identical" when it is main's head.
          status=$(gh api "repos/$GH_REPO/compare/main...$SHA" --jq .status) || status="unknown"
          case "$status" in
            identical | behind) echo "::notice::$TAG ($SHA) is on main ($status)." ;;
            *) fail+=("the tag's commit is not on main (compare says: $status)") ;;
          esac

          fields=databaseId,status,conclusion,url
          run=$(gh run list --workflow ci.yml --event push --branch main --commit "$SHA" --limit 1 --json "$fields" \
            --jq '.[0] // empty') || { echo "::warning::Couldn't list CI's runs on main"; run=""; }
          if [ -z "$run" ]; then
            fail+=("no CI run on main for $SHA")
          else
            id=$(jq -r .databaseId <<< "$run")
            if [ "$(jq -r .status <<< "$run")" != completed ]; then
              echo "Waiting for CI on main: $(jq -r .url <<< "$run")"
              timeout 90m gh run watch "$id" --interval 60 --compact || true
              run=$(gh run view "$id" --json "$fields") || run='{}'
            fi
            conclusion=$(jq -r '.conclusion // ""' <<< "$run")
            url=$(jq -r '.url // ""' <<< "$run")
            if [ "$(jq -r '.status // ""' <<< "$run")" = completed ] && [ "$conclusion" = success ]; then
              echo "::notice::CI passed on main for this commit ($url)."
            else
              fail+=("CI on main for this commit is ${conclusion:-not finished} ($url)")
            fi
          fi

          {
            echo "### Preflight for $TAG"
            echo
            if [ "${#fail[@]}" = 0 ]; then
              echo "The tag's commit is on main and CI passed on main for it. The installers are built."
            else
              echo "**Nothing is built or signed:**"
              for reason in "${fail[@]}"; do echo "- $reason"; done
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${#fail[@]}" != 0 ]; then
            for reason in "${fail[@]}"; do echo "::error title=Release preflight::$reason"; done
            exit 1
          fi

  build:
    name: Installers (${{ matrix.label }})
    needs: preflight
    # preflight is skipped (not a tag) or succeeded; a tag that failed it builds nothing.
    if: ${{ !cancelled() && (github.ref_type != 'tag' || needs.preflight.result == 'success') }}
    runs-on: ${{ matrix.runner }}
    # The signing legs of a release tag run in the release-signing Environment (docs/development.md "Signing secrets"): its
    # deployment rule admits only v*.*.* tags, its required reviewers approve the run, and its secrets are visible to no
    # other job. Every other run, and the Linux legs, run in no Environment, so they can't see those secrets.
    environment: ${{ github.ref_type == 'tag' && matrix.environment || '' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: mac_arm64, os: mac, label: macOS arm64, runner: macos-15, environment: release-signing }
          - { id: mac_x64, os: mac, label: macOS x64, runner: macos-15-intel, environment: release-signing }
          - { id: win_x64, os: win, label: Windows x64, runner: windows-2025, environment: release-signing }
          - { id: linux_x64, os: linux, label: Linux x64, runner: ubuntu-24.04, environment: "" }
          - { id: linux_arm64, os: linux, label: Linux arm64, runner: ubuntu-24.04-arm, environment: "" }
    # One output name per matrix leg (signing_mac_arm64, ...), as GitHub documents for matrix jobs ("jobs.<job_id>.outputs"):
    # outputs of one name would be overwritten by whichever leg finishes last. A leg sets only its own; the others stay
    # empty and the gate job reads the combined set. Each is signed, unsigned or not-required (Linux).
    outputs:
      signing_mac_arm64: ${{ steps.record.outputs.signing_mac_arm64 }}
      signing_mac_x64: ${{ steps.record.outputs.signing_mac_x64 }}
      signing_win_x64: ${{ steps.record.outputs.signing_win_x64 }}
      signing_linux_x64: ${{ steps.record.outputs.signing_linux_x64 }}
      signing_linux_arm64: ${{ steps.record.outputs.signing_linux_arm64 }}
    steps:
      # Tripwire for a mistake that would undo the Environment: a signing secret saved as a repository or organization secret
      # (the default place the Secrets page offers) is visible to every job of every workflow, including one a pull request
      # or an agent's branch edits. Outside a release tag this job runs in no Environment, so any signing secret that is
      # visible here is one of those. Only whether each is set is read (a `!= ''` expression); nothing is exported.
      - name: No signing secret outside the release-signing Environment
        if: ${{ github.ref_type != 'tag' }}
        shell: bash
        env:
          MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK != '' }}
          MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD != '' }}
          APPLE_ID: ${{ secrets.APPLE_ID != '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 != '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID != '' }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER != '' }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK != '' }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD != '' }}
        run: |
          visible=()
          for name in MACOS_CSC_LINK MACOS_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
            if [ "${!name}" = true ]; then visible+=("$name"); fi
          done
          if [ "${#visible[@]}" != 0 ]; then
            echo "::error title=Signing secret outside the release-signing Environment::${visible[*]} is visible to a run that is not for a release tag, so it is a repository or organization secret. Delete it there and add it to the release-signing Environment instead (docs/development.md, Signing secrets)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # rpmbuild is what electron-builder's rpm target runs; Xvfb gives the launch check a display.
      - name: Install rpm and Xvfb
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm xvfb

      # electron-builder's notarization wants APPLE_API_KEY to be the path of the .p8 file. Release tags only, like every
      # other use of a signing secret below; the file is deleted again right after the build.
      - name: Write the App Store Connect API key
        if: ${{ matrix.os == 'mac' && github.ref_type == 'tag' }}
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            umask 077
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi

      # fetch-browsers (run by dist) downloads this runner's Chromium, then electron-builder packages for this runner's
      # platform and architecture. Only a release tag's step is given this platform's secrets (the expressions below are
      # empty strings on every other trigger and for the other platforms); an unset secret is an empty string too, and
      # dist.mjs treats that as absent. It writes `signing` to this step's outputs and builds unsigned (and says so) when
      # the secrets are incomplete or the run is not for a release tag (scripts/signing.mjs).
      - name: Build the installers
        id: dist
        env:
          CSC_LINK: ${{ github.ref_type == 'tag' && matrix.os == 'mac' && secrets.MACOS_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ github.ref_type == 'tag' && matrix.os == 'mac' && secrets.MACOS_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ github.ref_type == 'tag' && matrix.os == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ github.ref_type == 'tag' && matrix.os == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ github.ref_type == 'tag' && matrix.os == 'mac' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_API_KEY_ID: ${{ github.ref_type == 'tag' && matrix.os == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ github.ref_type == 'tag' && matrix.os == 'mac' && secrets.APPLE_API_ISSUER || '' }}
          WIN_CSC_LINK: ${{ github.ref_type == 'tag' && matrix.os == 'win' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ github.ref_type == 'tag' && matrix.os == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
        run: pnpm --filter @run-hound/desktop dist

      - name: Delete the App Store Connect API key
        if: ${{ always() && matrix.os == 'mac' }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

      # A build that says it signed is checked, not believed: the signature on what the installer will install, that
      # Gatekeeper accepts it, and that the notarization ticket is stapled. Any failing check fails the job, so the gate
      # (which only reads what the job reports) can't publish it. Unsigned builds skip this; the gate refuses them anyway.
      - name: Verify the signature, Gatekeeper and notarization (macOS)
        if: ${{ matrix.os == 'mac' && steps.dist.outputs.signing == 'signed' }}
        shell: bash
        working-directory: desktop
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(release/*.dmg)
          if [ "${#dmgs[@]}" != 1 ]; then echo "::error::Expected one dmg in desktop/release, found ${#dmgs[@]}"; exit 1; fi
          mnt="$RUNNER_TEMP/verify-dmg"
          mkdir -p "$mnt"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "${dmgs[0]}"
          trap 'hdiutil detach "$mnt" -force > /dev/null 2>&1 || true' EXIT
          app=$(find "$mnt" -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$app" ]; then echo "::error::No .app in ${dmgs[0]}"; exit 1; fi
          echo "Verifying $app from ${dmgs[0]}"
          echo "## codesign --verify --deep --strict --verbose=2"
          codesign --verify --deep --strict --verbose=2 "$app"
          echo "## codesign -dvv (identity: a Developer ID Application certificate, not ad hoc, with the hardened runtime)"
          details=$(codesign -dvv "$app" 2>&1)
          echo "$details"
          grep -q '^Authority=Developer ID Application:' <<< "$details" || { echo "::error::The app is not signed with a Developer ID Application certificate"; exit 1; }
          if grep -q '^Signature=adhoc' <<< "$details"; then echo "::error::The app has only an ad hoc signature"; exit 1; fi
          grep -Eq '^CodeDirectory .*flags=0x[0-9a-f]+\(.*runtime' <<< "$details" || { echo "::error::The hardened runtime is not on"; exit 1; }
          echo "## spctl -a -vv -t exec"
          spctl -a -vv -t exec "$app"
          echo "## xcrun stapler validate"
          xcrun stapler validate "$app"

      - name: Verify the Authenticode signature (Windows)
        if: ${{ matrix.os == 'win' && steps.dist.outputs.signing == 'signed' }}
        shell: pwsh
        working-directory: desktop
        run: |
          $ErrorActionPreference = 'Stop'
          # The installer that will be published (the name package.json's artifactName gives it) and the app inside it.
          $files = @(Get-ChildItem release -Filter 'Run-Hound-*.exe' | Select-Object -ExpandProperty FullName) + @(Get-ChildItem release/win-unpacked -Filter 'Run Hound.exe' | Select-Object -ExpandProperty FullName)
          if ($files.Count -ne 2) { throw "Expected one installer and win-unpacked/Run Hound.exe in desktop/release, found: $($files -join ', ')" }
          $bad = @()
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature -FilePath $file
            $sig | Format-List Path, Status, StatusMessage, SignatureType | Out-String | Write-Host
            if ($sig.Status -ne 'Valid') { $bad += "$file : status $($sig.Status) ($($sig.StatusMessage))" }
            elseif ($null -eq $sig.SignerCertificate) { $bad += "$file : no signer certificate" }
            elseif ($null -eq $sig.TimeStamperCertificate) { $bad += "$file : the signature carries no timestamp, so it would stop validating when the certificate expires" }
            else { Write-Host "$file signed by $($sig.SignerCertificate.Subject), timestamped by $($sig.TimeStamperCertificate.Subject)" }
          }
          if ($bad.Count -gt 0) { $bad | ForEach-Object { Write-Host "::error::$_" }; exit 1 }

      - name: Record whether this build signed
        id: record
        shell: bash
        env:
          SIGNING: ${{ steps.dist.outputs.signing }}
        run: echo "signing_${{ matrix.id }}=$SIGNING" >> "$GITHUB_OUTPUT"

      - name: Checksums and summary
        shell: bash
        working-directory: desktop
        env:
          SIGNING: ${{ steps.dist.outputs.signing }}
          LABEL: ${{ matrix.label }}
        run: |
          node scripts/checksums.mjs release
          {
            echo "### Installers: $LABEL"
            echo
            echo "Signing: **$SIGNING**"
            echo
            echo '```'
            cat release/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The deb is installed with apt, which resolves the dependencies the package declares (the proof that they
      # suffice), and the installed app runs the same launch checks as CI's packaged build, including planning on the
      # bundled Chromium with no per-user cache. Linux x64 and arm64 are blocking.
      - name: Install the deb and launch it
        if: matrix.os == 'linux'
        working-directory: desktop
        run: |
          dpkg-deb -I release/*.deb | grep -E '^ (Package|Version|Architecture|Depends):'
          rpm -qp --requires release/*.rpm
          sudo apt-get install -y ./release/*.deb
          DESKTOP_EXECUTABLE="/opt/Run Hound/run-hound" xvfb-run -a node scripts/launch-check.mjs

      # macOS and Windows keep the runner's real profile (see launch-check.mjs); both block the build.
      - name: Launch the packaged app (macOS)
        if: matrix.os == 'mac'
        timeout-minutes: 10
        shell: bash
        working-directory: desktop
        run: |
          app=$(find release -maxdepth 2 -name '*.app' -print -quit)
          exe=$(find "$app/Contents/MacOS" -type f -perm -u+x -print -quit)
          DESKTOP_EXECUTABLE=$(node -p 'require("path").resolve(process.argv[1])' "$exe") node scripts/launch-check.mjs

      - name: Launch the packaged app (Windows)
        if: matrix.os == 'win'
        timeout-minutes: 10
        shell: bash
        working-directory: desktop
        run: |
          exe=$(find release/win-unpacked -maxdepth 1 -name '*.exe' -print -quit)
          DESKTOP_EXECUTABLE=$(node -p 'require("path").resolve(process.argv[1])' "$exe") node scripts/launch-check.mjs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.id }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.exe
            desktop/release/*.deb
            desktop/release/*.rpm
            desktop/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  # D5 (issue #48): the first-run check on a clean machine. A fresh GitHub runner is the clean machine: each leg downloads the
  # installer the build leg of its platform made, installs it the way docs/desktop-install.md tells a user to, drives the
  # INSTALLED app through desktop/scripts/first-run-check.mjs (first launch, model setup with a fake key, a representative
  # URL run against fixtures/samples/spa-fetch, cancellation, restart), uninstalls it, and checks that the app is gone and
  # the user's data is not. Only the harness (this checkout, pnpm install, Playwright) comes from the repo; the app under test
  # is the artifact. Evidence per leg (first-run.json, summary.md, the reports, two window screenshots, the package listing)
  # is the artifact first-run-<os>-<arch>[-<format>], kept 30 days; the job summary shows each step's result.
  #
  # Where a platform installs (desktop/package.json "build", app-builder-lib's NSIS templates and fpm targets, electron-builder 26.15.3):
  #   Linux deb/rpm  /opt/Run Hound/run-hound (symlinked from /usr/bin)   macOS  /Applications/Run Hound.app
  #   Windows        per-user one-click NSIS: %LOCALAPPDATA%\Programs\run-hound-desktop\Run Hound.exe (the folder is the package
  #                  name that build.extraMetadata sets; the search below doesn't depend on it)
  # Every leg has run green (PR #49), so all block. A new leg starts advisory (continue-on-error) and is flipped to
  # false once a run shows it green. The release gate
  # reads each leg's result (the `first_run_*` outputs) and refuses to publish when a blocking leg failed.
  first-run:
    name: First run (${{ matrix.label }})
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.advisory }}
    timeout-minutes: 30
    # One output per leg, <blocking|advisory>:<result>, for the release gate (an output of one name would be overwritten by
    # whichever leg finishes last, as for signing_* in the build job). A leg sets only its own; the others stay empty.
    outputs:
      linux_x64_deb: ${{ steps.result.outputs.linux_x64_deb }}
      linux_arm64_deb: ${{ steps.result.outputs.linux_arm64_deb }}
      macos_arm64: ${{ steps.result.outputs.macos_arm64 }}
      macos_x64: ${{ steps.result.outputs.macos_x64 }}
      windows_x64: ${{ steps.result.outputs.windows_x64 }}
      windows_2022_x64: ${{ steps.result.outputs.windows_2022_x64 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: linux-x64-deb, key: linux_x64_deb, os: linux, label: Linux x64 deb, runner: ubuntu-24.04, installers: linux_x64, advisory: false }
          - { id: linux-arm64-deb, key: linux_arm64_deb, os: linux, label: Linux arm64 deb, runner: ubuntu-24.04-arm, installers: linux_arm64, advisory: false }
          - { id: macos-arm64, key: macos_arm64, os: mac, label: macOS arm64, runner: macos-15, installers: mac_arm64, advisory: false }
          - { id: macos-x64, key: macos_x64, os: mac, label: macOS x64, runner: macos-15-intel, installers: mac_x64, advisory: false }
          - { id: windows-x64, key: windows_x64, os: win, label: Windows x64, runner: windows-2025, installers: win_x64, advisory: false }
          # The same installer (built on windows-2025) on the older image, so an OS or image difference shows up.
          - { id: windows-2022-x64, key: windows_2022_x64, os: win, label: Windows x64 (windows-2022), runner: windows-2022, installers: win_x64, advisory: false }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install the harness
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installers-${{ matrix.installers }}
          path: ${{ runner.temp }}/installers

      - name: Prepare the evidence folder
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/first-run-evidence"
          {
            echo "EVIDENCE=$RUNNER_TEMP/first-run-evidence"
            echo "FIRST_RUN_HOME=$RUNNER_TEMP/first-run-home"
            echo "INSTALLERS=$RUNNER_TEMP/installers"
          } >> "$GITHUB_ENV"

      # ----- install: the documented way, on this runner's clean user -----
      - name: Xvfb for the harness (Linux)
        if: matrix.os == 'linux'
        run: command -v xvfb-run > /dev/null || { sudo apt-get update && sudo apt-get install -y xvfb; }

      # `apt-get install ./<deb>` resolves the dependencies the package declares, which is the proof they suffice.
      - name: Install the deb (Linux)
        if: matrix.os == 'linux'
        run: |
          set -euo pipefail
          deb=$(ls "$INSTALLERS"/*.deb)
          sudo apt-get update
          sudo apt-get install -y "$deb"
          dpkg -L run-hound > "$EVIDENCE/package-files.txt"
          dpkg-query -W -f='${Package} ${Version} ${Architecture}\n' run-hound | tee "$EVIDENCE/installed.txt"
          exe=$(grep -m1 '^/opt/.*/run-hound$' "$EVIDENCE/package-files.txt")
          echo "ARTIFACT=$deb" >> "$GITHUB_ENV"
          echo "APP_EXE=$exe" >> "$GITHUB_ENV"
          echo "Installed $exe"

      # A dmg downloaded from Actions carries no quarantine mark, so Gatekeeper's prompt (an unsigned build's first launch) is
      # the maintainer's manual check (docs/desktop-acceptance.md), not this one's.
      - name: Install the dmg (macOS)
        if: matrix.os == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(ls "$INSTALLERS"/*.dmg)
          mnt="$RUNNER_TEMP/dmg"
          mkdir -p "$mnt"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          app=$(find "$mnt" -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$app" ]; then echo "::error::no .app in $dmg"; ls -la "$mnt"; exit 1; fi
          installed="/Applications/$(basename "$app")"
          ditto "$app" "$installed" || sudo ditto "$app" "$installed"
          hdiutil detach "$mnt" || hdiutil detach -force "$mnt"
          exe=$(find "$installed/Contents/MacOS" -type f -perm -u+x -print -quit)
          {
            plutil -p "$installed/Contents/Info.plist" | grep -E 'CFBundle(Name|DisplayName|ShortVersionString|Version|Executable)|LSMinimumSystemVersion'
            codesign -dv "$installed" 2>&1 || true
          } | tee "$EVIDENCE/installed.txt"
          echo "ARTIFACT=$dmg" >> "$GITHUB_ENV"
          echo "APP_EXE=$exe" >> "$GITHUB_ENV"
          echo "APP_BUNDLE=$installed" >> "$GITHUB_ENV"
          echo "Installed $installed"

      # The NSIS installer defaults (oneClick, per user), so it needs no elevation and installs under
      # %LOCALAPPDATA%\Programs. The folder is named from the package, not the product, so the exe is searched for.
      - name: Install the NSIS installer (Windows)
        if: matrix.os == 'win'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Get-ChildItem $env:INSTALLERS -Filter *.exe | Select-Object -First 1).FullName
          $p = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "The installer exited with $($p.ExitCode)" }
          $programs = Join-Path $env:LOCALAPPDATA 'Programs'
          Get-ChildItem $programs | Format-Table Name, FullName
          $exe = Get-ChildItem $programs -Recurse -Depth 2 -Filter 'Run Hound.exe' | Select-Object -First 1
          if (-not $exe) { throw "Run Hound.exe is not under $programs" }
          # What Settings > Apps > Installed apps lists: the uninstall docs rely on this entry.
          $entry = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' | Where-Object { $_.DisplayName -like '*Run Hound*' }
          if (-not $entry) { throw 'No "Run Hound" entry in the per-user Uninstall registry key' }
          $entry | Select-Object DisplayName, DisplayVersion, InstallLocation, UninstallString | Format-List | Out-String | Tee-Object -FilePath "$env:EVIDENCE\installed.txt"
          Add-Content -Path $env:GITHUB_ENV -Value "ARTIFACT=$installer"
          Add-Content -Path $env:GITHUB_ENV -Value "APP_EXE=$($exe.FullName)"
          Add-Content -Path $env:GITHUB_ENV -Value "APP_DIR=$($exe.DirectoryName)"

      # What the installed binary's Electron fuses are (electron-builder applies none unless `electronFuses` is configured, and it
      # isn't), on every platform, for comparison. Nothing is changed.
      - name: Electron fuses of the installed app
        if: ${{ env.APP_EXE != '' }}
        shell: bash
        run: node desktop/scripts/first-run-diagnose.mjs fuses --app "$APP_EXE" --evidence "$EVIDENCE"

      # ----- the check, on the installed app -----
      - name: First run
        id: first_run
        shell: bash
        run: |
          set -euo pipefail
          # Linux gets a fresh home. A fresh runner's own home is already clean on macOS and Windows (the check asserts it holds
          # no Run Hound data), and a made-up HOME has no login keychain there: macOS stops with a "Keychain Not Found" dialog
          # before the window, and Windows' profile is not ours to change.
          check=(node desktop/scripts/first-run-check.mjs --app "$APP_EXE" --evidence "$EVIDENCE" --artifact "$ARTIFACT")
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1280x960x24" "${check[@]}" --home "$FIRST_RUN_HOME"
          else
            "${check[@]}" --real-home
          fi

      # ----- when the first run failed: is it the app, or Playwright's way of starting it? -----
      # On Windows the installed app crashes at start-up (0x80000003, on a V8 background thread) with or without Playwright, so
      # the direct runs also try V8 flags and stock Electron, which needs Electron's binary (electron:fetch) and the built app.
      - name: Stock Electron and the unpackaged app, for the comparison (Windows, the first run failed)
        if: ${{ always() && matrix.os == 'win' && steps.first_run.outcome == 'failure' }}
        continue-on-error: true
        shell: bash
        run: |
          pnpm --filter @run-hound/desktop electron:fetch
          pnpm --filter @run-hound/desktop build

      # The installed app is run directly, with logging on: plain, and with the two flags Playwright adds (--inspect,
      # --remote-debugging-port). Each is watched for 25 s with a full-screen screenshot at 15 s, then killed. Linux runs on a
      # fresh home, macOS and Windows on the runner's own.
      - name: Run the installed app directly (the first run failed)
        if: ${{ always() && steps.first_run.outcome == 'failure' }}
        shell: bash
        run: |
          direct=(node desktop/scripts/first-run-diagnose.mjs direct --app "$APP_EXE" --evidence "$EVIDENCE")
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1280x960x24" "${direct[@]}"
          else
            "${direct[@]}"
          fi

      - name: Signature, Gatekeeper and system log of the installed app (macOS, the first run failed)
        if: ${{ always() && matrix.os == 'mac' && steps.first_run.outcome == 'failure' }}
        shell: bash
        run: |
          {
            echo "## codesign -dv --verbose=4"; codesign -dv --verbose=4 "$APP_BUNDLE" 2>&1
            echo; echo "## codesign --verify --deep --strict --verbose=2"; codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE" 2>&1
            echo; echo "## spctl -a -vv"; spctl -a -vv "$APP_BUNDLE" 2>&1
            echo; echo "## xattr -l"; xattr -l "$APP_BUNDLE" 2>&1
            echo; echo "## sw_vers"; sw_vers 2>&1
          } > "$EVIDENCE/macos-signature.txt" || true
          # The last 10 minutes cover the Playwright attempt and the direct runs.
          { sudo -n log show --last 10m --style compact --predicate 'process CONTAINS "Run Hound" OR eventMessage CONTAINS "Run Hound"' || log show --last 10m --style compact --predicate 'process CONTAINS "Run Hound" OR eventMessage CONTAINS "Run Hound"'; } 2>&1 | tail -n 500 > "$EVIDENCE/macos-log.txt" || true
          mkdir -p "$EVIDENCE/crash-reports"
          cp ~/Library/Logs/DiagnosticReports/*Run*Hound* "$EVIDENCE/crash-reports/" 2> /dev/null || true
          ls -la "$EVIDENCE/crash-reports" || true

      - name: Application Error events and the exe's signature (Windows, the first run failed)
        if: ${{ always() && matrix.os == 'win' && steps.first_run.outcome == 'failure' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $events = Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = 'Application Error', 'Windows Error Reporting' } -MaxEvents 5 -ErrorAction SilentlyContinue
          if ($events) { $events | Format-List TimeCreated, ProviderName, Id, Message | Out-File -Encoding utf8 "$env:EVIDENCE\windows-events.txt" }
          else { 'No Application Error or Windows Error Reporting events.' | Out-File -Encoding utf8 "$env:EVIDENCE\windows-events.txt" }
          Get-AuthenticodeSignature $env:APP_EXE | Format-List * | Out-File -Encoding utf8 "$env:EVIDENCE\authenticode.txt"
          (Get-Item $env:APP_EXE).VersionInfo | Format-List * | Out-File -Encoding utf8 "$env:EVIDENCE\exe-version.txt"
          exit 0

      # ----- uninstall the documented way, then check the app is gone and the data is not -----
      - name: Uninstall (Linux deb)
        if: ${{ always() && matrix.os == 'linux' && env.APP_EXE != '' }}
        run: sudo apt-get remove -y run-hound

      - name: Uninstall (macOS)
        if: ${{ always() && matrix.os == 'mac' && env.APP_BUNDLE != '' }}
        run: rm -rf "$APP_BUNDLE" || sudo rm -rf "$APP_BUNDLE"

      # The uninstaller copies itself to a temp folder and exits at once, so it is started without waiting; the next step
      # waits for the files to go.
      - name: Uninstall (Windows)
        if: ${{ always() && matrix.os == 'win' && env.APP_EXE != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $uninstaller = Get-ChildItem $env:APP_DIR -Filter 'Uninstall*.exe' | Select-Object -First 1
          if (-not $uninstaller) { throw "No uninstaller in $env:APP_DIR" }
          Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S'

      - name: Verify the uninstall (Linux deb)
        if: ${{ always() && matrix.os == 'linux' && env.APP_EXE != '' }}
        run: |
          set -euo pipefail
          if dpkg -l run-hound 2> /dev/null | grep -q '^ii'; then echo "::error::run-hound is still installed after apt-get remove"; exit 1; fi
          node desktop/scripts/first-run-check.mjs --after-uninstall --app "$APP_EXE" --evidence "$EVIDENCE" --home "$FIRST_RUN_HOME" --package-files "$EVIDENCE/package-files.txt"

      - name: Verify the uninstall (macOS)
        if: ${{ always() && matrix.os == 'mac' && env.APP_BUNDLE != '' }}
        run: node desktop/scripts/first-run-check.mjs --after-uninstall --app "$APP_EXE" --installed-path "$APP_BUNDLE" --evidence "$EVIDENCE" --real-home

      - name: Verify the uninstall (Windows)
        if: ${{ always() && matrix.os == 'win' && env.APP_EXE != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node desktop/scripts/first-run-check.mjs --after-uninstall --app $env:APP_EXE --installed-path $env:APP_DIR --evidence $env:EVIDENCE --real-home --wait-seconds 120
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The silent uninstaller removes the files first and its Installed-apps entry last, so wait for the entry too
          # (up to 60 s); one that stays is a real defect, a ghost in Settings > Apps.
          $deadline = (Get-Date).AddSeconds(60)
          do {
            $left = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like '*Run Hound*' }
            if (-not $left) { break }
            Start-Sleep -Seconds 2
          } while ((Get-Date) -lt $deadline)
          if ($left) { throw 'The "Run Hound" entry is still in the Uninstall registry key 60 s after the uninstall' }

      - name: Show each step's result
        if: always()
        shell: bash
        run: |
          if [ -n "${EVIDENCE:-}" ] && [ -f "$EVIDENCE/summary.md" ]; then
            cat "$EVIDENCE/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '### First run: %s\n\nNo evidence was written: the check did not start (see the log for the install step).\n' "${{ matrix.label }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "${EVIDENCE:-}" ] && [ -f "$EVIDENCE/diagnostics.md" ]; then
            cat "$EVIDENCE/diagnostics.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: first-run-${{ matrix.id }}
          path: ${{ runner.temp }}/first-run-evidence
          if-no-files-found: warn
          retention-days: 30

      # Last, so that every step above counts. job.status is success, failure or cancelled.
      - name: Record this leg's result for the release gate
        id: result
        if: always()
        shell: bash
        run: echo "${{ matrix.key }}=${{ matrix.advisory && 'advisory' || 'blocking' }}:${{ job.status }}" >> "$GITHUB_OUTPUT"

  # The rpm, in a Fedora container on the same two runners: a bare system, with none of the runner image's preinstalled
  # libraries, so `dnf install ./<rpm>` proves the dependencies the rpm declares are enough. Container jobs need an Ubuntu
  # runner (GitHub's "Running jobs in a container": "If you are using GitHub-hosted runners, you must use an Ubuntu runner"),
  # which ubuntu-24.04-arm is, and the fedora image is published for amd64 and arm64. The default shell in a container is sh,
  # so bash is asked for. Chromium needs more shared memory than Docker's 64 MB default. The harness (Node, pnpm, Xvfb) is
  # installed after the rpm, so what it pulls in can't hide a missing dependency of the app.
  first-run-rpm:
    name: First run (${{ matrix.label }})
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ${{ matrix.runner }}
    container:
      image: fedora:44
      options: --shm-size=1g
    continue-on-error: ${{ matrix.advisory }}
    timeout-minutes: 30
    outputs:
      linux_x64_rpm: ${{ steps.result.outputs.linux_x64_rpm }}
      linux_arm64_rpm: ${{ steps.result.outputs.linux_arm64_rpm }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: linux-x64-rpm, key: linux_x64_rpm, label: Linux x64 rpm (Fedora 44), runner: ubuntu-24.04, installers: linux_x64, advisory: false }
          - { id: linux-arm64-rpm, key: linux_arm64_rpm, label: Linux arm64 rpm (Fedora 44), runner: ubuntu-24.04-arm, installers: linux_arm64, advisory: false }
    steps:
      # What the actions need in a bare image (checkout falls back to the REST API without git, but git is cheap). None of it
      # is a library the app links.
      - name: Tools the actions need
        run: dnf install -y git tar gzip xz zstd which findutils

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installers-${{ matrix.installers }}
          path: ${{ runner.temp }}/installers

      # The rpm goes in before Node, pnpm, Xvfb and the font, so that what they pull in can't hide a dependency the rpm
      # should have declared.
      - name: Install the rpm
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/first-run-evidence"
          {
            echo "EVIDENCE=$RUNNER_TEMP/first-run-evidence"
            echo "FIRST_RUN_HOME=$RUNNER_TEMP/first-run-home"
          } >> "$GITHUB_ENV"
          evidence="$RUNNER_TEMP/first-run-evidence"
          rpm=$(ls "$RUNNER_TEMP"/installers/*.rpm)
          dnf install -y "$rpm"
          rpm -ql run-hound > "$evidence/package-files.txt"
          rpm -q --qf '%{NAME} %{VERSION}-%{RELEASE} %{ARCH}\n' run-hound | tee "$evidence/installed.txt"
          exe=$(grep -m1 '^/opt/.*/run-hound$' "$evidence/package-files.txt")
          echo "ARTIFACT=$rpm" >> "$GITHUB_ENV"
          echo "APP_EXE=$exe" >> "$GITHUB_ENV"
          echo "Installed $exe"

      # What pnpm/action-setup needs in a bare image: it ran npm (arm64: "spawn npm ENOENT") and a binary that links
      # libatomic (x64: "libatomic.so.1: cannot open shared object file"), and Fedora's image has neither.
      - name: Node, npm and libatomic for pnpm
        run: dnf install -y nodejs npm libatomic

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install the harness
        run: pnpm install --frozen-lockfile

      # A container has no desktop: Xvfb gives the app its display, and a font keeps the sample page's layout comparable to the
      # other legs'.
      - name: Xvfb and a font for the harness
        run: dnf install -y xorg-x11-server-Xvfb xorg-x11-xauth dejavu-sans-fonts

      # What the installed binary's Electron fuses are, for comparison with the other platforms (nothing is changed).
      - name: Electron fuses of the installed app
        run: node desktop/scripts/first-run-diagnose.mjs fuses --app "$APP_EXE" --evidence "$EVIDENCE"

      - name: First run
        id: first_run
        run: xvfb-run -a -s "-screen 0 1280x960x24" node desktop/scripts/first-run-check.mjs --app "$APP_EXE" --evidence "$EVIDENCE" --artifact "$ARTIFACT" --home "$FIRST_RUN_HOME"

      # When the first run failed, whether the installed app starts at all, started the way Playwright starts it and not.
      - name: Run the installed app directly (the first run failed)
        if: ${{ always() && steps.first_run.outcome == 'failure' }}
        run: xvfb-run -a -s "-screen 0 1280x960x24" node desktop/scripts/first-run-diagnose.mjs direct --app "$APP_EXE" --evidence "$EVIDENCE"

      - name: Uninstall (rpm)
        if: ${{ always() && env.APP_EXE != '' }}
        run: dnf remove -y run-hound

      - name: Verify the uninstall (rpm)
        if: ${{ always() && env.APP_EXE != '' }}
        run: |
          set -euo pipefail
          if rpm -q run-hound > /dev/null 2>&1; then echo "::error::run-hound is still installed after dnf remove"; exit 1; fi
          node desktop/scripts/first-run-check.mjs --after-uninstall --app "$APP_EXE" --evidence "$EVIDENCE" --home "$FIRST_RUN_HOME" --package-files "$EVIDENCE/package-files.txt"

      - name: Show each step's result
        if: always()
        run: |
          if [ -n "${EVIDENCE:-}" ] && [ -f "$EVIDENCE/summary.md" ]; then
            cat "$EVIDENCE/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '### First run: %s\n\nNo evidence was written: the check did not start (see the log for the install step).\n' "${{ matrix.label }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "${EVIDENCE:-}" ] && [ -f "$EVIDENCE/diagnostics.md" ]; then
            cat "$EVIDENCE/diagnostics.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: first-run-${{ matrix.id }}
          path: ${{ runner.temp }}/first-run-evidence
          if-no-files-found: warn
          retention-days: 30

      # Last, so that every step above counts. job.status is success, failure or cancelled.
      - name: Record this leg's result for the release gate
        id: result
        if: always()
        shell: bash
        run: echo "${{ matrix.key }}=${{ matrix.advisory && 'advisory' || 'blocking' }}:${{ job.status }}" >> "$GITHUB_OUTPUT"

  # Decides whether to publish, and says why not. The run must be a release tag whose preflight passed (its commit is on
  # main and CI passed there for it), every macOS and Windows build must have reported `signed` (Linux reports
  # not-required), the whole matrix must have succeeded, and no blocking first-run leg may have failed (the legs still
  # marked advisory in their matrix report here but never block).
  gate:
    name: Release gate
    needs: [preflight, build, first-run, first-run-rpm]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - name: Signed, and a release tag?
        id: gate
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          BUILD_OUTPUTS: ${{ toJSON(needs.build.outputs) }}
          FIRST_RUN_RESULT: ${{ needs.first-run.result }}
          FIRST_RUN_RPM_RESULT: ${{ needs.first-run-rpm.result }}
          FIRST_RUN_OUTPUTS: ${{ toJSON(needs.first-run.outputs) }}
          FIRST_RUN_RPM_OUTPUTS: ${{ toJSON(needs.first-run-rpm.outputs) }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          publish=false
          unsigned=()
          {
            echo "### Release gate"
            echo
            echo "| Build | Signing |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for id in mac_arm64 mac_x64 win_x64 linux_x64 linux_arm64; do
            state=$(jq -r --arg key "signing_$id" '.[$key] // "" | if . == "" then "no result" else . end' <<< "$BUILD_OUTPUTS")
            echo "| $id | $state |" >> "$GITHUB_STEP_SUMMARY"
            case "$id" in
              mac_* | win_*) [ "$state" = signed ] || unsigned+=("$id") ;;
            esac
          done
          # First run on clean machines (D5): each leg reported <blocking|advisory>:<result>. A blocking leg that did not
          # succeed stops publishing; an advisory one is listed and nothing more. A blocking leg that died without
          # reporting still fails its job, which the job-level result catches.
          {
            echo
            echo "| First run | Kind | Result |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          first_run_failed=()
          for key in linux_x64_deb linux_arm64_deb linux_x64_rpm linux_arm64_rpm macos_arm64 macos_x64 windows_x64 windows_2022_x64; do
            value=$(jq -rs --arg key "$key" 'add | .[$key] // ""' <<< "$FIRST_RUN_OUTPUTS $FIRST_RUN_RPM_OUTPUTS")
            if [ -z "$value" ]; then kind="-"; state="no result"; else kind=${value%%:*}; state=${value#*:}; fi
            echo "| $key | $kind | $state |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$kind" = blocking ] && [ "$state" != success ]; then first_run_failed+=("$key: $state"); fi
          done
          if [ "${#first_run_failed[@]}" = 0 ]; then
            for job in "first-run:$FIRST_RUN_RESULT" "first-run-rpm:$FIRST_RUN_RPM_RESULT"; do
              case "${job#*:}" in failure | cancelled) first_run_failed+=("${job%%:*} job: ${job#*:}") ;; esac
            done
          fi
          echo "Advisory first-run legs report in their own job summaries and artifacts, and block nothing until \`advisory\` is false in their matrix." >> "$GITHUB_STEP_SUMMARY"
          reasons=()
          if [ "${#first_run_failed[@]}" != 0 ]; then
            printf -v failed_list '%s, ' "${first_run_failed[@]}"
            reasons+=("first run failed (${failed_list%, })")
          fi
          if [ "$REF_TYPE" != tag ]; then reasons+=("not a release tag ($REF_NAME), so the installers stay workflow artifacts for 7 days"); fi
          # preflight is skipped on anything but a tag; on a tag it must have found the commit on main with CI green.
          if [ "$REF_TYPE" = tag ] && [ "$PREFLIGHT_RESULT" != success ]; then reasons+=("the tag's commit is not on main or CI has not passed on main for it, so nothing was built (preflight: $PREFLIGHT_RESULT)"); fi
          if [ "$BUILD_RESULT" != success ]; then reasons+=("a build did not succeed ($BUILD_RESULT)"); fi
          if [ "${#unsigned[@]}" != 0 ]; then reasons+=("unsigned builds (${unsigned[*]})"); fi
          if [ "${#reasons[@]}" = 0 ]; then
            verdict="publishing $REF_NAME: every macOS and Windows build is signed"
            publish=true
          else
            verdict="not published: ${reasons[0]}"
            for reason in "${reasons[@]:1}"; do verdict="$verdict; $reason"; done
          fi
          echo "$verdict"
          printf '\n**%s**\n' "$verdict" >> "$GITHUB_STEP_SUMMARY"
          if [ "$publish" = true ]; then echo "::notice::$verdict"; else echo "::warning::$verdict"; fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  # The only job that can write to the repository. It adds the desktop part to the tag's GitHub Release and never
  # publishes the release by itself unless this part completes it: scripts/release-coordination.mjs keeps the release a
  # draft until release-images.yml's part (the images, the compose file, the CHANGELOG notes) is in as well, and merges
  # the two parts' notes instead of overwriting either. The concurrency group is the one release-images.yml's github-release
  # job uses, so the two parts never edit the release at the same moment (a lost notes update would drop a part's block).
  publish:
    name: Attach to the GitHub Release
    needs: [build, gate]
    if: ${{ needs.gate.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-publish-${{ github.ref_name }}
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/downloaded
          pattern: installers-*

      - name: Collect the installers, write SHA256SUMS and the notes, and add them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(jq -r .version app/package.json)
          if [ "$TAG" != "v$version" ]; then
            echo "::error file=app/package.json::Tag $TAG does not match app/package.json ($version)"
            exit 1
          fi

          assets="$RUNNER_TEMP/assets"
          notes="$RUNNER_TEMP/notes.md"
          mkdir -p "$assets"
          find "$RUNNER_TEMP/downloaded" -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} "$assets/" \;

          # Belt and braces after the gate: the full set is here (2 dmg, 1 exe, 2 deb, 2 rpm) and none is named unsigned.
          count() { find "$assets" -maxdepth 1 -name "*.$1" | wc -l; }
          if [ "$(count dmg)" != 2 ] || [ "$(count exe)" != 1 ] || [ "$(count deb)" != 2 ] || [ "$(count rpm)" != 2 ]; then
            echo "::error::Expected 2 dmg, 1 exe, 2 deb and 2 rpm installers, found: $(ls "$assets" | tr '\n' ' ')"
            exit 1
          fi
          if find "$assets" -name '*-unsigned.*' | grep -q .; then
            echo "::error::An installer is named unsigned: not published"
            exit 1
          fi

          node desktop/scripts/checksums.mjs "$assets"
          # Only the installer table: the CHANGELOG part of the notes is release-images.yml's.
          node desktop/scripts/release-notes.mjs --version "$version" --tag "$TAG" --assets "$assets" --installers-only --out "$notes"

          # The release is published only when both parts are in: this one and release-images.yml's images part.
          node desktop/scripts/release-coordination.mjs publish --tag "$TAG" --part desktop --require images,desktop --notes-file "$notes" "$assets"/*
          {
            echo
            echo "Installers and checksums for $TAG:"
            echo
            echo '```'
            cat "$assets/SHA256SUMS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
