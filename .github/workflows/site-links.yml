# The site's external links, weekly (DESIGN.md §5.2 "Links": external links checked weekly, non-blocking): builds the
# site and runs site/scripts/lab/specs/external-links.spec.mjs, which asks every address a page or llms.txt links to
# leaving the site. Nothing depends on it; a failed run is the weekly report, and its JSON is kept as an artefact.
# Internal links, #fragments and repository links are checked on every change by pnpm build and pnpm test (ci.yml).
name: Site links

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-links:
    name: External links
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: site/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm build

      - name: Check the external links
        run: pnpm lab external-links

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-external-links
          path: site/.lab-out/
          if-no-files-found: warn
          retention-days: 30
