# Type-checks and runs every suite: Run Hound's unit and browser tests, Kennel's and Fernway's own tests, and the
# acceptance suite (Run Hound against Kennel and Fernway in clean mode and with every planted bug, plus the unfamiliar
# sample apps).
name: CI

on:
  push:
    branches: [main, v0]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Kennel and Fernway are built once below; the suites reuse their dist/ instead of rebuilding it.
      KENNEL_SKIP_BUILD: "1"
      FERNWAY_SKIP_BUILD: "1"
    steps:
      - uses: actions/checkout@v7

      # No version input: pnpm/action-setup reads "packageManager" (pnpm@12.3.4) from package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and its system dependencies
        run: pnpm --filter run-hound exec playwright install --with-deps chromium

      - name: Type-check
        run: |
          pnpm --filter run-hound exec tsc --noEmit
          pnpm --filter kennel exec tsc --noEmit
          pnpm --filter fernway exec tsc --noEmit
          pnpm --filter acceptance exec tsc --noEmit

      - name: Validate the compose files
        run: docker compose config --quiet && docker compose -f run-hound.compose.yml config --quiet

      - name: Build Kennel
        run: pnpm --filter kennel build

      - name: Build Fernway
        run: pnpm --filter fernway build

      - name: Run Hound tests (unit and browser)
        run: pnpm --filter run-hound test

      - name: Kennel tests (clean mode and every bug)
        run: pnpm --filter kennel test

      - name: Fernway tests (clean mode and every bug)
        run: pnpm --filter fernway test

      - name: Acceptance (Run Hound against Kennel, Fernway and the sample apps)
        run: pnpm test:acceptance
