# Type-checks and runs every suite, split into parallel jobs (the old single "test" job took ~52 minutes; splitting
# it, and the lab below, cuts a PR's wall-clock time to about the slowest parallel piece instead of the sum of them):
#   - app-tests: Run Hound's unit and browser tests, sharded 1..4 with vitest's own `--shard` (by test file; the app
#     suite needs no Kennel or Fernway build -- it only reads fixtures/kennel/bugs.json as ground truth).
#   - acceptance-kennel / acceptance-fernway: the acceptance suite (Run Hound against Kennel and Fernway in clean mode
#     and with every planted bug, plus the unfamiliar sample apps), split by which fixture app each test file needs, so
#     each job builds only Kennel or only Fernway instead of both. kennel.acceptance.test.ts alone (25 modes: clean
#     plus each V0/V1 bug) and fernway.acceptance.test.ts alone (8 routes, 19 planted bugs, sign-in and write-side
#     runs; 40 tests) are the suite's two long poles; each anchors one job, padded with the acceptance suite's other,
#     lighter files. acceptance-fernway names its files explicitly; acceptance-kennel excludes exactly that list, so
#     it is the catch-all and a new acceptance test file always lands in one job or the other, never neither.
#   - checks: type-checks every package, validates the compose files, and runs Kennel's and Fernway's own tests (short
#     on their own, so not worth a job each).
# The rest is as before: images builds the four Docker images (amd64, nothing pushed) and smoke-tests them in the
# compose test lab; site lints and builds the marketing site (site/, its own pnpm project); site-lab runs its
# Playwright lab, now as a 4-way matrix too (site/scripts/lab/run.mjs --shard, greedy-packed by measured spec weight).
# Release images (release-images.yml) runs this workflow for the tagged commit unless this workflow's push run on
# main already passed for that exact commit (its ci-status job); either way no image is published unless all of it
# passed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # When release-images.yml calls this workflow, github.workflow is the caller's name ("Release images"), so a release
  # never cancels, or is cancelled by, a CI run on the same ref.
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Run Hound's own unit and browser tests, sharded by vitest's own `--shard=<i>/<n>` (splits the resolved test-file
  # list into n roughly-equal, non-overlapping groups; confirmed against the installed vitest, 5.0.1 -- both `--help`
  # and its source carry it). No Kennel or Fernway build: app/src and app/test only read fixtures/kennel/bugs.json as
  # static ground-truth data, never start either app.
  app-tests:
    name: "Run Hound tests (${{ matrix.shard }}/${{ strategy.job-total }})"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      # No version input: pnpm/action-setup reads "packageManager" (pnpm@12.3.4) from package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and its system dependencies
        run: pnpm --filter run-hound exec playwright install --with-deps chromium

      - name: "Run Hound tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})"
        run: pnpm --filter run-hound exec vitest run --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # The acceptance suite (Run Hound against Kennel and Fernway in clean mode and with every planted bug, plus the
  # unfamiliar sample apps) split in two by which fixture app each test file needs, not by vitest's own `--shard`:
  # with only 7 files and two of them (kennel.acceptance.test.ts's 25 modes, fernway.acceptance.test.ts's 8 routes,
  # 19 planted bugs and sign-in/write-side runs, 40 tests) far outweighing the rest, an even-file-count `--shard`
  # split would leave one job with both long poles and the other nearly empty. Grouping by app instead balances the
  # two jobs AND means each builds only the one fixture app its files start, instead of both (as the old single job
  # always did). acceptance-fernway names its files explicitly (only they need Fernway); acceptance-kennel excludes
  # exactly that list with vitest's `--exclude`, so it is the catch-all and a new acceptance test file always lands
  # in one job or the other, never silently in neither.
  acceptance-kennel:
    name: "Acceptance: Kennel (1/2)"
    runs-on: ubuntu-latest
    # Measured on main (run 36562271670): kennel.acceptance.test.ts 10.0 min, plus setup (~1 min); acceptance-fernway
    # below is the tighter one (~16 min against a 20-minute timeout), so both get the same headroom.
    timeout-minutes: 30
    env:
      # Built once below; the suite reuses dist/ instead of rebuilding it.
      KENNEL_SKIP_BUILD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium and its system dependencies
        run: pnpm --filter run-hound exec playwright install --with-deps chromium
      - name: Build Kennel
        run: pnpm --filter kennel build
      # kennel.acceptance.test.ts (every Kennel mode) and evidence.acceptance.test.ts (evidence capture) both start
      # Kennel; golden.test.ts and fernway-docs.test.ts start no browser and no fixture app at all ("no browser, no
      # Kennel" / "no browser, no Fernway" in their own headers) and just ride along here. This job is the catch-all:
      # rather than name its own files, it excludes exactly acceptance-fernway's explicit list below (vitest 5.0.1's
      # `--exclude <glob>`, confirmed with `--help`), so a new acceptance test file neither of them already names
      # still runs, here. FERNWAY_SKIP_BUILD isn't set in this job, so a Fernway-dependent file that lands here still
      # builds Fernway itself first (slower than acceptance-fernway, which reuses the build below, but it runs).
      - name: "Acceptance: Kennel modes, evidence, golden files, Fernway docs, and anything not in acceptance-fernway"
        run: >
          pnpm --filter acceptance exec vitest run
          --exclude '**/fernway.acceptance.test.ts' --exclude '**/samples.acceptance.test.ts'
          --exclude '**/fernway-helpers.test.ts'

  acceptance-fernway:
    name: "Acceptance: Fernway (2/2)"
    runs-on: ubuntu-latest
    # Measured on main (run 36562271670): fernway.acceptance.test.ts 14.8 min, samples.acceptance.test.ts 2.5 min,
    # plus setup (~1 min) -- about 16 min, too close to a 20-minute timeout.
    timeout-minutes: 30
    env:
      # Built once below; the suite reuses dist/ instead of rebuilding it.
      FERNWAY_SKIP_BUILD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium and its system dependencies
        run: pnpm --filter run-hound exec playwright install --with-deps chromium
      - name: Build Fernway
        run: pnpm --filter fernway build
      # fernway.acceptance.test.ts starts Fernway; samples.acceptance.test.ts starts the (Fernway-independent) sample
      # apps; fernway-helpers.test.ts starts no browser and no Fernway ("no browser, no Fernway" in its own header)
      # and just rides along here. This is the explicit list acceptance-kennel's job above excludes; add a file's
      # name here only when it truly needs Fernway, since anything left out defaults to running in that job instead.
      - name: "Acceptance: Fernway routes and bugs, sample apps, Fernway helpers"
        run: >
          pnpm --filter acceptance exec vitest run
          src/fernway.acceptance.test.ts src/samples.acceptance.test.ts src/fernway-helpers.test.ts

  # The short things the old "test" job also ran: type-checking, the compose files, and Kennel's and Fernway's own
  # test suites (0.5 and 2.7 minutes measured; not worth a job, and their own runner's queue time, each).
  checks:
    name: Checks (type-check, compose files, Kennel and Fernway tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Built once below; the suites reuse dist/ instead of rebuilding it.
      KENNEL_SKIP_BUILD: "1"
      FERNWAY_SKIP_BUILD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Kennel's and Fernway's own suites drive a real browser (fixtures/*/test/*.test.ts).
      - name: Install Chromium and its system dependencies
        run: pnpm --filter run-hound exec playwright install --with-deps chromium

      - name: Type-check
        run: |
          pnpm --filter run-hound exec tsc --noEmit
          pnpm --filter kennel exec tsc --noEmit
          pnpm --filter fernway exec tsc --noEmit
          pnpm --filter acceptance exec tsc --noEmit

      - name: Validate the compose files
        run: docker compose config --quiet && docker compose -f run-hound.compose.yml config --quiet

      - name: Build Kennel
        run: pnpm --filter kennel build

      - name: Build Fernway
        run: pnpm --filter fernway build

      - name: Kennel tests (clean mode and every bug)
        run: pnpm --filter kennel test

      - name: Fernway tests (clean mode and every bug)
        run: pnpm --filter fernway test

  images:
    name: Docker images (build and smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: version
        run: echo "version=$(jq -r .version app/package.json)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      # linux/amd64 only, loaded into the runner's Docker (nothing is pushed). The tags are the ones both compose files
      # use, so the test lab below runs exactly these builds. The GHA cache scopes are CI's own ("ci-<image>");
      # release-images.yml reads them too, so a release after a green main rebuilds little.
      - name: Build run-hound
        uses: docker/build-push-action@v7
        with:
          context: .
          file: app/Dockerfile
          platforms: linux/amd64
          load: true
          provenance: false
          tags: ghcr.io/rahul-bharati/run-hound:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=ci-run-hound
          cache-to: type=gha,mode=max,scope=ci-run-hound

      - name: Build run-hound-kennel
        uses: docker/build-push-action@v7
        with:
          context: .
          file: fixtures/kennel/Dockerfile
          platforms: linux/amd64
          load: true
          provenance: false
          tags: ghcr.io/rahul-bharati/run-hound-kennel:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=ci-run-hound-kennel
          cache-to: type=gha,mode=max,scope=ci-run-hound-kennel

      - name: Build run-hound-samples
        uses: docker/build-push-action@v7
        with:
          context: .
          file: fixtures/samples/Dockerfile
          platforms: linux/amd64
          load: true
          provenance: false
          tags: ghcr.io/rahul-bharati/run-hound-samples:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=ci-run-hound-samples
          cache-to: type=gha,mode=max,scope=ci-run-hound-samples

      - name: Build run-hound-fernway
        uses: docker/build-push-action@v7
        with:
          context: .
          file: fixtures/fernway/Dockerfile
          platforms: linux/amd64
          load: true
          provenance: false
          tags: ghcr.io/rahul-bharati/run-hound-fernway:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=ci-run-hound-fernway
          cache-to: type=gha,mode=max,scope=ci-run-hound-fernway

      - name: "Smoke test: run-hound --version is app/package.json's version"
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker image ls --format 'table {{.Repository}}:{{.Tag}}\t{{.Size}}' | grep -E 'REPOSITORY|rahul-bharati'
          out=$(docker run --rm "ghcr.io/rahul-bharati/run-hound:$VERSION" --version)
          echo "$out"
          if [ "$out" != "run-hound $VERSION" ]; then
            echo "::error::run-hound --version printed \"$out\", expected \"run-hound $VERSION\""
            exit 1
          fi

      - name: "Smoke test: the run-hound image stays Chromium-only and under 1 GB"
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # About 0.7 GB with Chromium's headless shell only (0.3.0, on Playwright's image with every browser: 2.8 GB).
          size=$(docker image inspect -f '{{.Size}}' "ghcr.io/rahul-bharati/run-hound:$VERSION")
          echo "run-hound image: $((size / 1000000)) MB"
          browsers=$(docker run --rm --entrypoint sh "ghcr.io/rahul-bharati/run-hound:$VERSION" -c 'ls /ms-playwright')
          echo "$browsers"
          if [ "$size" -gt 1000000000 ]; then
            echo "::error::The run-hound image is $((size / 1000000)) MB; it should stay under 1000 MB (see app/Dockerfile)."
            exit 1
          fi
          if echo "$browsers" | grep -qE '^(firefox|webkit|chromium)-'; then
            echo "::error::The run-hound image should ship only chromium_headless_shell (see app/Dockerfile)."
            exit 1
          fi

      - name: "Smoke test: the documented plain docker run works with no -e flags"
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # README's main way to run Run Hound. The image's own defaults must let it reach the machine running it
          # (host.docker.internal) and keep saved settings in the mounted runs folder.
          mkdir -p plain-runs
          docker run -d --name plain --init -p 127.0.0.1:4500:4000 --add-host host.docker.internal:host-gateway \
            -v "$PWD/plain-runs:/repo/app/runs" "ghcr.io/rahul-bharati/run-hound:$VERSION"
          for _ in $(seq 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4500/ || true)
            [ "$code" = 200 ] && break
            sleep 1
          done
          docker logs plain 2>&1 | head -5
          if [ "$code" != 200 ]; then
            echo "::error::The UI of a plain docker run answered ${code:-nothing}, expected 200"
            exit 1
          fi
          if ! docker logs plain 2>&1 | grep -q 'open http://localhost:4000'; then
            echo "::error::A plain docker run should print the address to open (http://localhost:4000)"
            exit 1
          fi
          settings=$(curl -s -H 'X-Run-Hound: 1' http://127.0.0.1:4500/api/settings)
          echo "$settings" | jq '{allowedHosts, file: .ai.file}'
          if ! echo "$settings" | jq -e '.allowedHosts | index("host.docker.internal")' > /dev/null; then
            echo "::error::A plain docker run should allow host.docker.internal by default"
            exit 1
          fi
          if [ "$(echo "$settings" | jq -r .ai.file)" != /repo/app/runs/.config/ai.json ]; then
            echo "::error::A plain docker run should keep saved settings in the mounted runs folder (runs/.config)"
            exit 1
          fi

      - name: Stop the plain docker run
        if: always()
        run: docker rm -f plain > /dev/null 2>&1 || true

      - name: Start the test lab (run-hound.compose.yml with the images built above)
        run: |
          mkdir -p runs
          docker compose -f run-hound.compose.yml up --detach --pull never --wait --wait-timeout 180
          docker compose -f run-hound.compose.yml ps

      - name: "Smoke test: the UI, Kennel, Fernway and the samples answer"
        run: |
          for url in http://127.0.0.1:4000/ http://127.0.0.1:3000/book http://127.0.0.1:3100/book \
            http://127.0.0.1:4110/ http://127.0.0.1:4111/ http://127.0.0.1:4101/signup http://127.0.0.1:4102/ \
            http://127.0.0.1:4103/ http://127.0.0.1:4104/ http://127.0.0.1:4106/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
            echo "$url -> $code"
            if [ "$code" != 200 ]; then
              echo "::error::$url answered $code, expected 200"
              exit 1
            fi
          done

      - name: "Smoke test: a CLI run in the lab finds Kennel's bugs (exit 1)"
        run: |
          set +e
          docker compose -f run-hound.compose.yml run --rm -T run-hound run http://kennel:3000/book --approve all | tee run.log
          code=${PIPESTATUS[0]}
          set -e
          findings=$(grep -oE '^[0-9]+ findings' run.log | grep -oE '^[0-9]+' || true)
          echo "exit code $code, ${findings:-no} findings"
          if [ "$code" != 1 ]; then
            echo "::error::Expected exit code 1 (confirmed findings), got $code"
            exit 1
          fi
          # 23 on Kennel with every bug; one check (replaying requests past the browser) only runs on localhost.
          if [ "${findings:-0}" -lt 20 ]; then
            echo "::error::Expected at least 20 findings on Kennel with every bug, got ${findings:-0}"
            exit 1
          fi
          ls runs/*/report.html runs/*/report.json

      - name: Logs of the test lab
        if: failure()
        run: docker compose -f run-hound.compose.yml logs --no-color

      - name: Stop the test lab
        if: always()
        run: docker compose -f run-hound.compose.yml down

  site:
    name: Marketing site (lint and build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      # site/ is its own pnpm project (not in the root workspace); its package.json names the pnpm version.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: site/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Unit tests for the structured data, the SEO build guard (scripts/check-seo.mjs) and the site's data modules.
      - name: Test
        run: pnpm test

      # pnpm build also runs scripts/csp.mjs and scripts/check-seo.mjs --strict, which fails on a page without a
      # title, description, canonical or valid JSON-LD.
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm build

      # What the deploy builds (Coolify, base directory /site): the Dockerfile with only site/ as its context, including
      # the image-cache warm-up (scripts/warm-images.mjs), which pnpm build never runs.
      - name: Build the site's Docker image
        run: docker build --build-arg NEXT_PUBLIC_SITE_URL=https://example.com -t run-hound-site:ci .

  # The site's Playwright lab (DESIGN.md §5.1 rule 6, §5.2): builds the site, serves the standalone build as the Docker
  # image does, and runs every spec of site/scripts/lab/specs/ (the baseline and the external links only when named),
  # the release gate included, as a 4-way matrix (run.mjs --shard, scripts/lab/lib/shard.mjs's greedy-by-measured-
  # weight packing: motion-contract-1.spec.mjs, motion-contract-2.spec.mjs and release-gate.spec.mjs, the three long
  # poles, each anchor a shard of its own so none waits behind another; the fourth shard packs every lighter spec).
  # Required for a release (a release reuses main's passing run or calls this workflow); on a pull request it reports
  # without blocking the merge. The screenshots and each spec's JSON are kept as an artefact, one per shard
  # (upload-artifact v4 refuses two artefacts with the same name in one run).
  site-lab:
    name: "Marketing site (lab, ${{ matrix.shard }}/${{ strategy.job-total }})"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: site/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install the site's dependencies
        run: pnpm install --frozen-lockfile

      # The release gate also runs Run Hound's own focus-visible and reflow-320 checks on the built site, from ../app.
      - name: Install Run Hound's dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      # Chromium for every spec; Firefox and WebKit for the cross-browser smoke set (cross-browser.spec.mjs).
      - name: Install the browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm build

      - name: "Lab (shard ${{ matrix.shard }}/${{ strategy.job-total }})"
        env:
          # The cross-browser smoke set fails, rather than skips, a browser that can't start.
          LAB_ALL_BROWSERS: "1"
        run: pnpm lab --shard ${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Keep the lab's output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-lab-${{ matrix.shard }}
          path: site/.lab-out/
          if-no-files-found: warn
          retention-days: 14
