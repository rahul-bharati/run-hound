# Publishes a release when a version tag is pushed (git tag v0.4.1 && git push origin v0.4.1): the Docker images
#   ghcr.io/rahul-bharati/run-hound          Run Hound (web UI + CLI, Chromium's headless shell included)
#   ghcr.io/rahul-bharati/run-hound-kennel   Kennel, the deliberately broken demo app
#   ghcr.io/rahul-bharati/run-hound-samples  the well-built sample apps (false-positive suite)
#   ghcr.io/rahul-bharati/run-hound-fernway  Fernway, a Lovable-style SaaS test app (clean, or with planted bugs)
# for linux/amd64 and linux/arm64, tagged 0.4.1, 0.4 and latest (latest only for a pushed release tag, not a
# pre-release such as v0.5.0-rc.1 or a manual run), then the GitHub Release v0.4.1 with run-hound.compose.yml and
# .env.example (as run-hound.env.example) attached.
#
# Nothing in the repo pins a release any more (docs/decisions/09-2026.md#2026-09-29-images-latest-no-version-pins): a
# release is app/package.json's version, site.ts's version and released date, and this file's CHANGELOG section; and
# run-hound.compose.yml's published images always resolve ghcr.io/rahul-bharati/<name>:${RUNHOUND_TAG:-latest}.
#
# Order:
#   1. check-version: the tag matches app/package.json, and its CHANGELOG.md section exists (a pushed tag only, since
#      it becomes the GitHub Release's notes); every image: line in run-hound.compose.yml is exactly one of the four
#      ghcr.io/rahul-bharati/<name>:${RUNHOUND_TAG:-latest} values and every one in docker-compose.yml is exactly one
#      of the four ghcr.io/rahul-bharati/<name>:local values, all four present in each file.
#   2. ci-status, then ci: the whole CI workflow (every test suite, the image build and smoke test, the site build and
#      its lab) must pass for this commit. When CI's run on main for this exact commit passed, it isn't run again
#      (ci-status waits for it while it is still running); otherwise this workflow runs CI itself.
#   3. build: each image for each platform on a runner of that platform (arm64 on GitHub's arm64 runners, no QEMU),
#      pushed by digest only (no tag yet) and started there as a sanity check.
#   4. merge: per image, one multi-platform index from its two digests, and only then the tags.
#   5. github-release: the GitHub Release (a pushed tag only), once every image is published, so
#      releases/latest/download/run-hound.compose.yml never names images that aren't on GHCR yet.
#
# GHCR needs no setup: the workflow's GITHUB_TOKEN pushes. New GHCR packages are private: after the first release,
# open each package (github.com/rahul-bharati?tab=packages) → Package settings → Change visibility → Public.
#
# Optional Docker Hub mirror: add the repository variable DOCKERHUB_USERNAME (Settings → Secrets and variables →
# Actions → Variables) and the secret DOCKERHUB_TOKEN (a Docker Hub access token with Read & Write). When both are
# set, every release is also pushed to docker.io/<DOCKERHUB_USERNAME>/<image>; without them the step is skipped.
name: Release images

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.4.1 (must match app/package.json)"
        required: true

# The jobs that need more set their own: actions: read (ci-status), packages: write (build and merge, which push the
# images), contents: write (github-release).
permissions:
  contents: read

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: The tag matches app/package.json and its CHANGELOG section, and no compose image is pinned to a version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          tag="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          pkg=$(jq -r .version app/package.json)
          fail=0
          if [ "$tag" != "$pkg" ]; then
            echo "::error file=app/package.json::Version $tag does not match app/package.json ($pkg)"
            fail=1
          fi

          # Every image: line, in both files, checked exactly (not just "contains" or "isn't pinned"): each of
          # run-hound.compose.yml's must be one of the four ghcr.io/rahul-bharati/<name>:${RUNHOUND_TAG:-latest}
          # values, and each of docker-compose.yml's one of the four ghcr.io/rahul-bharati/<name>:local values (built
          # from source, never a release tag or latest, so a local build can't be mistaken for, or silently shadow, a
          # published one) -- with all four present in each file. This also catches an extra image: line, a name
          # missing, or docker-compose.yml drifting onto :latest. Single-quoted so ${RUNHOUND_TAG:-latest} is kept
          # literal here, never expanded by this shell.
          # shellcheck disable=SC2016 # the ${RUNHOUND_TAG:-latest} below is compose syntax, compared as text
          run_hound_expected=('ghcr.io/rahul-bharati/run-hound:${RUNHOUND_TAG:-latest}' 'ghcr.io/rahul-bharati/run-hound-kennel:${RUNHOUND_TAG:-latest}' 'ghcr.io/rahul-bharati/run-hound-samples:${RUNHOUND_TAG:-latest}' 'ghcr.io/rahul-bharati/run-hound-fernway:${RUNHOUND_TAG:-latest}')
          local_expected=('ghcr.io/rahul-bharati/run-hound:local' 'ghcr.io/rahul-bharati/run-hound-kennel:local' 'ghcr.io/rahul-bharati/run-hound-samples:local' 'ghcr.io/rahul-bharati/run-hound-fernway:local')
          for file in run-hound.compose.yml docker-compose.yml; do
            if [ "$file" = run-hound.compose.yml ]; then expected=("${run_hound_expected[@]}"); else expected=("${local_expected[@]}"); fi
            count=0
            while IFS=: read -r line ref; do
              [ -n "$ref" ] || continue
              image=$(printf '%s' "$ref" | sed -E 's/^[[:space:]]*image:[[:space:]]*//')
              count=$((count + 1))
              ok=0
              for e in "${expected[@]}"; do [ "$image" = "$e" ] && ok=1 && break; done
              if [ "$ok" != 1 ]; then
                echo "::error file=$file,line=$line::$image is not one of $file's four expected images"
                fail=1
              fi
            done < <(grep -noE 'image:[[:space:]]*[^[:space:]#]+' "$file" || true)
            if [ "$count" != 4 ]; then
              echo "::error file=$file::Found $count image: lines, expected exactly 4"
              fail=1
            fi
          done

          # The GitHub Release's notes are this version's CHANGELOG.md section ("## 0.4.1 ..." up to the next "## "):
          # a pushed tag needs one before anything is published, not only once the images are out. A manual run
          # creates no GitHub Release.
          if [ "$GITHUB_EVENT_NAME" = push ] && ! awk -v v="$tag" '
            $1 == "##" { h = $2; sub(/,$/, "", h); if (h == v) { found = 1; exit } }
            END { exit !found }' CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::No \"## $tag\" section: the GitHub Release takes its notes from it"
            fail=1
          fi

          if [ "$fail" != 0 ]; then exit 1; fi
          echo "version=$pkg" >> "$GITHUB_OUTPUT"

  # Every suite, the image smoke tests, the site build and its lab (ci.yml), unless ci-status (below) found that CI's
  # run on main for this exact commit passed. Nothing is pushed unless one or the other passed.
  ci:
    needs: [check-version, ci-status]
    # passed is empty if ci-status itself failed (it shouldn't: it reports false on any error), and CI runs then too.
    if: ${{ !cancelled() && needs.check-version.result == 'success' && needs.ci-status.outputs.passed != 'true' }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # CI runs on every push to main, and a release is normally a tag on a commit main has just tested. When that run
  # passed for this exact commit, it ran the same ci.yml on the same files, the site lab included (the lab blocks on
  # main; only a pull request lets it fail), so running it again would only repeat every check for the same answer.
  # When main's run failed, was cancelled (a later push to main cancels it), timed out or doesn't exist (a tag on a
  # commit that never was main's head, or a manual run from another branch), passed is false and this workflow runs
  # CI itself, as it always did.
  ci-status:
    name: CI on main for this commit
    needs: check-version
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.status.outputs.passed }}
    steps:
      # A run still queued or in progress is waited for rather than run a second time. CI's jobs all have time limits
      # well under the 90 minutes given here, so the watch normally ends with a conclusion.
      - name: Did CI pass on main for this commit?
        id: status
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          passed=false
          fields=databaseId,status,conclusion,url
          run=$(gh run list --workflow ci.yml --event push --branch main --commit "$SHA" --limit 1 --json "$fields" \
            --jq '.[0] // empty') || { echo "::warning::Couldn't list CI's runs on main"; run=""; }
          if [ -z "$run" ]; then
            echo "::notice::No CI run on main for $SHA, so this release runs CI itself."
          else
            id=$(jq -r .databaseId <<< "$run")
            if [ "$(jq -r .status <<< "$run")" != completed ]; then
              echo "Waiting for CI on main: $(jq -r .url <<< "$run")"
              timeout 90m gh run watch "$id" --interval 60 --compact || true
              run=$(gh run view "$id" --json "$fields") || run='{}'
            fi
            status=$(jq -r '.status // "unknown"' <<< "$run")
            conclusion=$(jq -r '.conclusion // ""' <<< "$run")
            url=$(jq -r '.url // ""' <<< "$run")
            if [ "$status" = completed ] && [ "$conclusion" = success ]; then
              passed=true
              echo "::notice::CI passed on main for this commit ($url), so this release doesn't run it again."
            else
              echo "::notice::CI on main for this commit is ${conclusion:-$status} ($url), so this release runs CI itself."
            fi
          fi
          echo "passed=$passed" >> "$GITHUB_OUTPUT"

  # Each image for each platform on a runner of that platform: arm64 on GitHub's arm64 runners (free for public
  # repositories) instead of under QEMU on x86, which made arm64 the slow half of every release. This is Docker's
  # pattern for a build split across runners (docs.docker.com/build/ci/github-actions/multi-platform/): each leg pushes
  # its platform by digest only, with no tag, and merge (below) joins an image's two digests into one index and tags
  # that, so no tag ever points at one platform alone or at an image that failed its sanity check.
  build:
    name: Build ${{ matrix.image.name }} (${{ matrix.target.platform }})
    needs: [check-version, ci-status, ci]
    # ci skipped because ci-status found CI passed on main must not skip the images (!cancelled() stops GitHub skipping
    # this job just because ci was skipped); a failed or cancelled ci, or a skipped one that ci-status didn't clear,
    # never lets them run.
    if: >-
      ${{ !cancelled() && needs.check-version.result == 'success' && (needs.ci.result == 'success' ||
      (needs.ci.result == 'skipped' && needs.ci-status.outputs.passed == 'true')) }}
    runs-on: ${{ matrix.target.runner }}
    permissions:
      contents: read
      packages: write
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # merge (below) uses this same list.
        image: &images
          - name: run-hound
            file: app/Dockerfile
            title: Run Hound
            description: AI-assisted UI testing for AI-built apps; real checks in a real browser decide.
          - name: run-hound-kennel
            file: fixtures/kennel/Dockerfile
            title: Run Hound Kennel
            description: Kennel, a deliberately broken booking app for trying Run Hound.
            port: "3000"
            path: /book
          - name: run-hound-samples
            file: fixtures/samples/Dockerfile
            title: Run Hound sample apps
            description: Well-built sample apps Run Hound should report no confirmed findings on.
            port: "4102"
            path: /
          - name: run-hound-fernway
            file: fixtures/fernway/Dockerfile
            title: Run Hound Fernway
            description: Fernway, a Lovable-style SaaS test app with optional planted bugs.
            port: "4110"
            path: /
        target:
          - platform: linux/amd64
            arch: amd64
            uname: x86_64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            uname: aarch64
            runner: ubuntu-24.04-arm
    env:
      HAS_DOCKERHUB: ${{ vars.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
      DOCKERHUB_IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (optional mirror)
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Labels go on each platform's image config and annotations on each platform's manifest here; merge puts the
      # same annotations on the multi-platform index, which is where GHCR reads the package description from. Both
      # include org.opencontainers.image.source (links the package to this repository), .version and .revision (the
      # tagged commit), which metadata-action fills in itself. merge runs this step with these same inputs for its tags.
      - name: Image names, tags, labels and annotations
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest
        with: &metadata
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.HAS_DOCKERHUB == 'true' && env.DOCKERHUB_IMAGE || '' }}
          # latest=false: metadata-action would otherwise add latest to any non-pre-release semver tag, a manual run
          # included; the raw entry below is the only one that sets it (a pushed release tag only).
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.check-version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.check-version.outputs.version }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && !contains(needs.check-version.outputs.version, '-') }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image.title }}
            org.opencontainers.image.description=${{ matrix.image.description }}
            org.opencontainers.image.licenses=MIT
          annotations: |
            org.opencontainers.image.title=${{ matrix.image.title }}
            org.opencontainers.image.description=${{ matrix.image.description }}
            org.opencontainers.image.licenses=MIT

      - name: Where to push
        id: push
        run: |
          names=$GHCR_IMAGE
          if [ "$HAS_DOCKERHUB" = true ]; then names="$names,$DOCKERHUB_IMAGE"; fi
          echo "names=$names" >> "$GITHUB_OUTPUT"

      # This platform only, pushed by digest to GHCR (and the Docker Hub mirror), untagged. The amd64 leg mostly comes
      # from CI's cache (scope ci-<image>), built from this same commit on main or by this run's own ci. Each leg also
      # keeps a scope of its own (<image>-<arch>), but GitHub lets only runs on the same tag read a tag's cache: it
      # speeds up a re-run of this release, not the next release.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image.file }}
          platforms: ${{ matrix.target.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=image,"name=${{ steps.push.outputs.names }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: |
            type=gha,scope=${{ matrix.image.name }}-${{ matrix.target.arch }}
            ${{ matrix.target.arch == 'amd64' && format('type=gha,scope=ci-{0}', matrix.image.name) || '' }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.target.arch }}

      # CI runs only amd64 images, so the arm64 ones would otherwise never be started anywhere. Each leg pulls the
      # digest it just pushed and starts it natively, before any tag points at it: uname -m is the platform's,
      # run-hound prints --version (Node, tsx and esbuild's native binary all have to work), the apps must answer on
      # their port. It doesn't launch Chromium; that stays a manual check on arm64.
      - name: Sanity check (${{ matrix.target.platform }}, native)
        env:
          IMAGE: ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.target.platform }}
          UNAME: ${{ matrix.target.uname }}
          NAME: ${{ matrix.image.name }}
          VERSION: ${{ needs.check-version.outputs.version }}
          APP_PORT: ${{ matrix.image.port }}
          APP_PATH: ${{ matrix.image.path }}
        run: |
          docker pull "$IMAGE"
          arch=$(docker run --rm --entrypoint uname "$IMAGE" -m)
          echo "uname -m: $arch"
          if [ "$arch" != "$UNAME" ]; then
            echo "::error::$IMAGE for $PLATFORM reports $arch, expected $UNAME"
            exit 1
          fi
          if [ "$NAME" = run-hound ]; then
            out=$(docker run --rm "$IMAGE" --version)
            echo "$out"
            if [ "$out" != "run-hound $VERSION" ]; then
              echo "::error::$PLATFORM run-hound --version printed \"$out\", expected \"run-hound $VERSION\""
              exit 1
            fi
            exit 0
          fi
          docker run --detach --name sanity-check -e PORT="$APP_PORT" -p "127.0.0.1:18080:$APP_PORT" "$IMAGE"
          ok=no
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null "http://127.0.0.1:18080$APP_PATH"; then ok=yes; break; fi
            sleep 2
          done
          docker logs sanity-check
          docker rm -f sanity-check
          if [ "$ok" != yes ]; then
            echo "::error::$IMAGE for $PLATFORM didn't answer on port $APP_PORT within 2 minutes"
            exit 1
          fi

      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      # The image name comes last in the artifact's name: run-hound is a prefix of the other three names, and merge
      # picks an image's two digests by how the artifact's name ends.
      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.target.arch }}-${{ matrix.image.name }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # One multi-platform index per image from its amd64 and arm64 digests, tagged 0.4.1, 0.4 (and latest) on GHCR and
  # the optional Docker Hub mirror. It runs only once every leg of build has passed, so a release never tags some
  # images while another failed to build or start.
  merge:
    name: Publish ${{ matrix.image.name }}
    needs: [check-version, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: *images
    env:
      HAS_DOCKERHUB: ${{ vars.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
      DOCKERHUB_IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image.name }}
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*-${{ matrix.image.name }}
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (optional mirror)
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # build's inputs (same tags, labels and annotations), with the annotations for the index this time.
      - name: Image names, tags, labels and annotations
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with: *metadata

      - name: Create the multi-platform index and tag it
        working-directory: ${{ runner.temp }}/digests
        run: |
          digests=(*)
          if [ "${#digests[@]}" != 2 ]; then
            echo "::error::Expected 2 digests (amd64 and arm64) for $GHCR_IMAGE, found ${#digests[@]}: ${digests[*]}"
            exit 1
          fi
          annotations=()
          while IFS= read -r annotation; do
            annotations+=(--annotation "$annotation")
          done < <(jq -r '.annotations[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          repos=("$GHCR_IMAGE")
          if [ "$HAS_DOCKERHUB" = true ]; then repos+=("$DOCKERHUB_IMAGE"); fi
          for repo in "${repos[@]}"; do
            tags=()
            while IFS= read -r tag; do
              tags+=(--tag "$tag")
            done < <(jq -r --arg prefix "$repo:" '.tags[] | select(startswith($prefix))' <<< "$DOCKER_METADATA_OUTPUT_JSON")
            if [ "${#tags[@]}" = 0 ]; then
              echo "::error::metadata-action gave no tags for $repo"
              exit 1
            fi
            sources=()
            for digest in "${digests[@]}"; do sources+=("$repo@sha256:$digest"); done
            docker buildx imagetools create "${annotations[@]}" "${tags[@]}" "${sources[@]}"
          done

      # Each tag must now be an index with both platforms (and their provenance attestations, which are listed as
      # unknown/unknown and left out of the comparison).
      - name: Every tag has both platforms
        run: |
          fail=0
          for tag in $(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON"); do
            docker buildx imagetools inspect "$tag"
            platforms=$(docker buildx imagetools inspect --raw "$tag" |
              jq -r '[.manifests[].platform | select(.os != "unknown") | .os + "/" + .architecture] | sort | join(",")')
            if [ "$platforms" != linux/amd64,linux/arm64 ]; then
              echo "::error::$tag has ${platforms:-no platforms}, expected linux/amd64,linux/arm64"
              fail=1
            fi
          done
          exit "$fail"

  # The GitHub Release for the tag: title "Run Hound 0.4.1", this version's CHANGELOG.md section as its notes, and the
  # compose file and settings example of the tagged commit attached. It runs only after every image's merge passed,
  # which is the point: README.md, TESTING.md and the site hand out
  # https://github.com/rahul-bharati/run-hound/releases/latest/download/run-hound.compose.yml, and that URL can only
  # ever name images that are already on GHCR. (They used to hand out the compose file pinned to the tag, which exists
  # from the moment the tag is pushed, before its images were published.) A pre-release is published as one, so
  # releases/latest, like the latest image tag, stays on the last release. A manual run has no tag and skips this job.
  github-release:
    name: GitHub Release
    needs: [check-version, merge]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.merge.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Create the GitHub Release (or update it, on a re-run)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          tag="v$VERSION"
          assets="$RUNNER_TEMP/assets"
          notes="$RUNNER_TEMP/notes.md"
          mkdir -p "$assets"
          cp run-hound.compose.yml "$assets/run-hound.compose.yml"
          # GitHub renames an asset whose name starts with a dot, so .env.example goes up under a name of its own.
          cp .env.example "$assets/run-hound.env.example"

          # A pre-release's attached compose file defaults RUNHOUND_TAG to this pre-release, not latest: nothing in
          # the repo pins a version any more, so an unset RUNHOUND_TAG resolves :latest, which for a pre-release would
          # silently run the previous full release instead of the version the page is for.
          if [[ "$VERSION" == *-* ]]; then
            sed -i "s/\${RUNHOUND_TAG:-latest}/\${RUNHOUND_TAG:-$VERSION}/" "$assets/run-hound.compose.yml"
          fi

          # The body of the "## <version> ..." heading, up to the next "## " heading, without the blank lines around
          # it. Relative links (docs/usage.md) are made absolute at this tag, since a release page doesn't resolve them.
          awk -v v="$VERSION" '
            $1 == "##" { if (found) exit; h = $2; sub(/,$/, "", h); found = (h == v); next }
            found { lines[++n] = $0 }
            END {
              first = 1; while (first <= n && lines[first] == "") first++
              last = n; while (last >= first && lines[last] == "") last--
              for (i = first; i <= last; i++) print lines[i]
            }
          ' CHANGELOG.md |
            sed -E "s|\]\((\./)?([^):/#][^):]*)\)|]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$tag/\2)|g" > "$notes"
          if [ ! -s "$notes" ]; then
            echo "::error file=CHANGELOG.md::The \"## $VERSION\" section is missing or empty"
            exit 1
          fi

          if [[ "$VERSION" == *-* ]]; then flags=(--prerelease); else flags=(--latest); fi
          files=("$assets/run-hound.compose.yml" "$assets/run-hound.env.example")
          if gh release view "$tag" > /dev/null 2>&1; then
            # A re-run: the release, or the draft an interrupted create left, is already there.
            gh release upload "$tag" "${files[@]}" --clobber
            gh release edit "$tag" --title "Run Hound $VERSION" --notes-file "$notes" --draft=false "${flags[@]}"
          else
            # With assets, gh creates the release as a draft, uploads them and only then publishes it, so the latest
            # release never lacks its compose file.
            gh release create "$tag" "${files[@]}" --verify-tag --title "Run Hound $VERSION" --notes-file "$notes" \
              "${flags[@]}"
          fi
