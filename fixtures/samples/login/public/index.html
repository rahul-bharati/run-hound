<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - Pinecone Accounts</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<main>
  <h1 id="form-title">Sign in to Pinecone</h1>

  <form id="signin" aria-labelledby="form-title" novalidate>
    <p class="hint">Demo account: demo@example.test, password correct-horse.</p>
    <div class="field">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" autocomplete="email" spellcheck="false" required aria-describedby="email-error">
      <p class="error" id="email-error"></p>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required aria-describedby="password-error">
      <p class="error" id="password-error"></p>
      <p><button type="button" class="secondary" id="toggle" aria-controls="password" aria-pressed="false">Show password</button></p>
    </div>
    <button type="submit" id="submit">Sign in</button>
    <p class="status is-error" id="alert" role="alert"></p>
  </form>

  <section id="account" aria-labelledby="account-title" hidden>
    <h2 id="account-title">You're signed in</h2>
    <p>Signed in as <strong id="who"></strong>.</p>
    <button type="button" class="secondary" id="signout">Sign out</button>
  </section>
  <p class="status" id="status" role="status" aria-live="polite"></p>
</main>
</body>
</html>
