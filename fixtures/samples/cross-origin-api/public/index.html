<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="api-port" content="__API_PORT__">
<title>RSVP - Riverside Meetup</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<main>
  <h1 id="form-title">RSVP for the Riverside Meetup</h1>
  <p>Tell us if you're coming. Fields marked "required" must be filled in.</p>

  <form id="rsvp" aria-labelledby="form-title" novalidate>
    <div class="field">
      <label for="name">Your name (required)</label>
      <input type="text" id="name" name="name" autocomplete="name" required maxlength="80" aria-describedby="name-error">
      <p class="error" id="name-error"></p>
    </div>
    <div class="field">
      <label for="email">Email address (required)</label>
      <input type="email" id="email" name="email" autocomplete="email" spellcheck="false" required maxlength="254" aria-describedby="email-error">
      <p class="error" id="email-error"></p>
    </div>
    <fieldset aria-describedby="attending-error">
      <legend>Are you coming? (required)</legend>
      <label class="choice"><input type="radio" name="attending" value="yes" checked> Yes, I'll be there</label>
      <label class="choice"><input type="radio" name="attending" value="no"> No, I can't make it</label>
      <p class="error" id="attending-error"></p>
    </fieldset>
    <div class="field">
      <label for="guests">Number of people, including you</label>
      <input type="number" id="guests" name="guests" inputmode="numeric" min="1" max="6" value="1" required aria-describedby="guests-hint guests-error">
      <p class="hint" id="guests-hint">From 1 to 6.</p>
      <p class="error" id="guests-error"></p>
    </div>
    <div class="field">
      <label for="dietary">Dietary needs (optional)</label>
      <textarea id="dietary" name="dietary" maxlength="500" aria-describedby="dietary-error"></textarea>
      <p class="error" id="dietary-error"></p>
    </div>
    <button type="submit" id="send">Send RSVP</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </form>

  <section aria-labelledby="list-title">
    <h2 id="list-title">Who's replied</h2>
    <p id="empty" class="meta">No replies yet.</p>
    <ul class="list" id="rsvps"></ul>
  </section>
</main>
</body>
</html>
