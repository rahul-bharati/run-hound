# Origin for the static export in /usr/share/nginx/html (next.config.ts: output "export", trailingSlash true).
# Cloudflare sits in front: compression and security headers are set at the edge, not here.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Relative redirects, so /docs -> /docs/ stays on the visitor's https domain behind the proxies.
  absolute_redirect off;
  server_tokens off;

  # Every page is <route>/index.html. HTML is revalidated so a deploy shows up immediately.
  location / {
    try_files $uri $uri/ $uri.html =404;
    add_header Cache-Control "no-cache" always;
  }

  # Hashed build assets never change: let Cloudflare and browsers keep them.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
