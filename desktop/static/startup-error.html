<!doctype html>
<html lang="en" data-shell="desktop">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run Hound can't start</title>
<style>
/* Colours are the Run Hound palette in app/src/core/brand.ts (BRAND); desktop/tests/startup-error.test.ts fails if they drift.
   Layout follows the main window: a 36 px drag strip in place of the system title bar (desktop/src/shell.ts). */
:root { --bg:#0A1014; --bg-deep:#070B0E; --surface:#10171C; --surface-3:#19242B; --line:#1E2A31; --line-soft:#172127; --line-strong:#2A3841;
  --fg:#E9EFEC; --muted:#A7B4B0; --accent:#5EE6A3; --accent-strong:#7DEDB6; --accent-ink:#04150D;
  --sans:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono:ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; color-scheme: dark; }
* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--surface-3) transparent; }
html, body { height: 100%; }
body { margin:0; display:flex; flex-direction:column; background:var(--bg); color:var(--fg); font:15px/1.5 var(--sans); -webkit-font-smoothing:antialiased; }
.desktop-titlebar { flex:none; height:36px; background:var(--bg-deep); -webkit-app-region:drag; user-select:none; }
main { flex:1; min-height:0; display:flex; flex-direction:column; padding:1.25rem 1.75rem 1.5rem; }
header { display:flex; align-items:center; gap:.9rem; }
header img { display:block; width:40px; height:40px; flex:none; }
h1 { margin:0; font-size:1.3rem; line-height:1.2; font-weight:800; letter-spacing:-.02em; }
#problems { flex:1; min-height:0; overflow-y:auto; margin:1rem 0 1.1rem; padding-right:.4rem; }
#problems p { margin:0 0 .75rem; color:var(--fg); white-space:pre-wrap; overflow-wrap:anywhere; }
#details { margin:0 0 .75rem; padding:.6rem .8rem; border:1px solid var(--line); border-radius:12px; background:var(--surface); color:var(--muted); font:.76rem/1.5 var(--mono); white-space:pre-wrap; overflow-wrap:anywhere; max-height:7rem; overflow-y:auto; }
footer { flex:none; display:flex; justify-content:flex-end; }
button { font:inherit; font-weight:600; cursor:pointer; min-height:44px; padding:.55rem 1.3rem; border-radius:12px; border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink); }
button:hover { background:var(--accent-strong); border-color:var(--accent-strong); }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
a { color:var(--accent); }
</style>
</head>
<body>
<div class="desktop-titlebar" aria-hidden="true"></div>
<main>
  <header>
    <img src="icon.png" alt="" width="40" height="40">
    <h1 id="title">Run Hound can't start</h1>
  </header>
  <div id="problems" role="alert"></div>
  <footer><button id="quit" type="button">Quit Run Hound</button></footer>
</main>
<script>
// The messages arrive in the query string (desktop/src/startup-error.ts) and go in with textContent only, never as HTML.
(function () {
  var query = new URLSearchParams(location.search);
  var title = query.get("title");
  if (title) {
    document.getElementById("title").textContent = title;
    document.title = title;
  }
  var problems = [];
  try {
    var parsed = JSON.parse(query.get("problems") || "[]");
    if (Array.isArray(parsed)) problems = parsed.filter(function (p) { return typeof p === "string" && p !== ""; });
  } catch (e) { /* show the details alone */ }
  var list = document.getElementById("problems");
  problems.forEach(function (text) {
    var p = document.createElement("p");
    p.textContent = text;
    list.appendChild(p);
  });
  var details = query.get("details");
  if (details) {
    var pre = document.createElement("pre");
    pre.id = "details";
    pre.textContent = details;
    list.appendChild(pre);
  }
  var quit = document.getElementById("quit");
  // Closing the window ends the app: the main process waits for it to close, then exits (desktop/src/main.ts).
  quit.addEventListener("click", function () { window.close(); });
  quit.focus();
})();
</script>
</body>
</html>
