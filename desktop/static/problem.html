<!doctype html>
<html lang="en" data-shell="desktop">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run Hound</title>
<style>
/* Colours are the Run Hound palette in app/src/core/brand.ts (BRAND); desktop/tests/problem-page.test.ts fails if they drift.
   Same look as startup-error.html. This page also appears inside the main and report windows, whose preloads add their own
   title bar strip rules, so the strip and the room under it are set here exactly as those rules set them (desktop/src/chrome-css.ts). */
:root { --bg:#0A1014; --bg-deep:#070B0E; --surface:#10171C; --surface-3:#19242B; --line:#1E2A31; --line-soft:#172127; --line-strong:#2A3841;
  --fg:#E9EFEC; --muted:#A7B4B0; --accent:#5EE6A3; --accent-strong:#7DEDB6; --accent-ink:#04150D;
  --sans:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono:ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; color-scheme: dark; }
* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--surface-3) transparent; }
html, body { height: 100%; }
body { margin:0; padding-top:36px; display:flex; flex-direction:column; background:var(--bg); color:var(--fg); font:15px/1.5 var(--sans); -webkit-font-smoothing:antialiased; }
.desktop-titlebar { position:fixed; top:0; left:0; right:0; height:36px; z-index:2147483647; background:var(--bg-deep); -webkit-app-region:drag; user-select:none; }
/* A column that stays readable in a full-size window (the main window's page) and fills the small error window. */
main { flex:1; min-height:0; width:100%; max-width:42rem; margin:0 auto; display:flex; flex-direction:column; justify-content:center; padding:1.25rem 1.75rem 1.5rem; }
header { display:flex; align-items:center; gap:.9rem; }
header img { display:block; width:40px; height:40px; flex:none; }
h1 { margin:0; font-size:1.3rem; line-height:1.2; font-weight:800; letter-spacing:-.02em; }
#problems { flex:0 1 auto; min-height:0; overflow-y:auto; margin:1rem 0 1.1rem; padding-right:.4rem; }
#problems p { margin:0 0 .75rem; color:var(--fg); white-space:pre-wrap; overflow-wrap:anywhere; }
#details { margin:0 0 .75rem; padding:.6rem .8rem; border:1px solid var(--line); border-radius:12px; background:var(--surface); color:var(--muted); font:.76rem/1.5 var(--mono); white-space:pre-wrap; overflow-wrap:anywhere; max-height:7rem; overflow-y:auto; }
/* The first button, the main choice, is on the right; the order for the keyboard stays first to last. */
footer { flex:none; display:flex; flex-direction:row-reverse; justify-content:flex-start; gap:.6rem; }
button { font:inherit; font-weight:600; cursor:pointer; min-height:44px; padding:.55rem 1.3rem; border-radius:12px; border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink); }
button:hover { background:var(--accent-strong); border-color:var(--accent-strong); }
button.secondary { border-color:var(--line-strong); background:transparent; color:var(--fg); }
button.secondary:hover { background:var(--surface-3); border-color:var(--line-strong); }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<div class="desktop-titlebar" aria-hidden="true"></div>
<main>
  <header>
    <img src="icon.png" alt="" width="40" height="40">
    <h1 id="title">Run Hound ran into a problem</h1>
  </header>
  <div id="problems" role="alert"></div>
  <footer id="actions"></footer>
</main>
<script>
// What to say arrives in the query string (desktop/src/problem-page.ts) and goes in with textContent only, never as HTML.
(function () {
  // The labels are fixed here; the query only says which buttons to show, and in which order.
  var LABELS = { dismiss: "Keep using Run Hound", quit: "Quit Run Hound", retry: "Try again", reload: "Reload" };
  var query = new URLSearchParams(location.search);
  var title = query.get("title");
  if (title) {
    document.getElementById("title").textContent = title;
    document.title = title;
  }
  var problems = [];
  try {
    var parsed = JSON.parse(query.get("problems") || "[]");
    if (Array.isArray(parsed)) problems = parsed.filter(function (p) { return typeof p === "string" && p !== ""; });
  } catch (e) { /* show the details alone */ }
  var list = document.getElementById("problems");
  problems.forEach(function (text) {
    var p = document.createElement("p");
    p.textContent = text;
    list.appendChild(p);
  });
  var details = query.get("details");
  if (details) {
    var pre = document.createElement("pre");
    pre.id = "details";
    pre.textContent = details;
    list.appendChild(pre);
  }
  var footer = document.getElementById("actions");
  var presses = 0;
  var first = null;
  (query.get("actions") || "").split(",").forEach(function (id) {
    if (!Object.prototype.hasOwnProperty.call(LABELS, id)) return;
    var button = document.createElement("button");
    button.type = "button";
    button.id = id;
    button.textContent = LABELS[id];
    if (first) button.className = "secondary"; else first = button;
    // A button changes this page's own address to #<id>-<n>; the main process hears it (desktop/src/problem-page.ts).
    // The counter makes a second press of the same button a new address.
    button.addEventListener("click", function () { presses += 1; location.hash = id + "-" + presses; });
    footer.appendChild(button);
  });
  if (first) first.focus();
})();
</script>
</body>
</html>
